<script>
/* =====================================================================
 * JavaScript.html — Giao diện 1 trang: đăng nhập, khung app, Tổng quan,
 * Sơ đồ phòng, Cấu hình, Tài khoản. Không dùng framework, chỉ Bootstrap.
 * ===================================================================== */
(function () {
  'use strict';

  /* ------------------------------------------------------------ Tiện ích */
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var num = function (v) {
    if (typeof v === 'number') return v;
    var s = String(v == null ? '' : v).replace(/[^\d.,-]/g, '');
    s = /^-?\d{1,3}([.,]\d{3})+$/.test(s) ? s.replace(/[.,]/g, '') : s.replace(',', '.');
    var n = Number(s); return isNaN(n) ? 0 : n;
  };
  var fmtThousands = function (n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); };
  /* ô tiền: tự chèn dấu chấm hàng nghìn khi gõ */
  document.addEventListener('input', function (e) {
    if (!e.target.classList || !e.target.classList.contains('money-input')) return;
    var digits = e.target.value.replace(/\D/g, '');
    e.target.value = digits ? fmtThousands(Number(digits)) : '';
  });
  var vnd = function (n) { return Math.round(num(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' đ'; };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { /* bỏ qua */ } },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) { /* bỏ qua */ } }
  };

  /** Phiên bản giao diện, phải khớp APP_VERSION trong Schema.gs. */
  var UI_VERSION = '1.3.4';

  var S = { token: store.get('bh_token') || '', boot: null, thumbs: {}, view: '' };
  var busyCount = 0;
  function busy(on) { busyCount += on ? 1 : -1; $('#busy').style.display = busyCount > 0 ? 'block' : 'none'; }

  function toast(msg, kind) {
    var el = document.createElement('div');
    el.className = 'toast-msg ' + (kind || '');
    el.textContent = msg;
    $('#toast-wrap').appendChild(el);
    setTimeout(function () { el.remove(); }, kind === 'err' ? 6000 : 3000);
  }

  /* Hai cách chạy:
   *  - Trong Apps Script (doGet): gọi server bằng google.script.run.
   *  - Ngoài Apps Script (GitHub Pages): POST JSON tới Web App URL trong config.js (doPost). */
  var CFG = window.NHATRO_CONFIG || {};
  var IN_GAS = !!(window.google && google.script && google.script.run);
  var API_URL = String(CFG.API_URL || '');
  var API_READY = IN_GAS || /^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL);

  /** Gửi { action, token, payload } → Promise kết quả thô { ok, data | error, code }. */
  function rpc(action, payload) {
    if (IN_GAS) {
      return new Promise(function (resolve, reject) {
        var run = google.script.run.withSuccessHandler(resolve)
          .withFailureHandler(function (e) { reject(new Error(e && e.message ? e.message : 'Mất kết nối, vui lòng thử lại.')); });
        if (action === 'auth.login') run.login(payload.username, payload.password);
        else run.api(S.token, action, payload || {});
      });
    }
    if (!API_READY) return Promise.reject(new Error('Chưa cấu hình API_URL trong config.js.'));
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, CFG.REQUEST_TIMEOUT_MS || 60000) : null;
    return fetch(API_URL, {
      method: 'POST', redirect: 'follow', signal: ctrl ? ctrl.signal : undefined,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },          // text/plain: không preflight CORS
      body: JSON.stringify({ action: action, token: S.token, payload: payload || {} })
    }).then(function (r) {
      if (!r.ok) throw new Error('Máy chủ trả lỗi ' + r.status + '.');
      return r.json();
    }).catch(function (e) {
      throw new Error(e && e.name === 'AbortError' ? 'Máy chủ phản hồi quá lâu, vui lòng thử lại.' :
        (e && /Máy chủ/.test(e.message) ? e.message : 'Mất kết nối, vui lòng thử lại.'));
    }).then(function (res) { if (timer) clearTimeout(timer); return res; }, function (e) { if (timer) clearTimeout(timer); throw e; });
  }

  /** Gọi API server, trả Promise dữ liệu. Lỗi phiên → về màn đăng nhập. */
  function call(action, payload, opts) {
    opts = opts || {};
    if (!opts.silent) busy(true);
    return rpc(action, payload).then(function (res) {
      if (!opts.silent) busy(false);
      if (res && res.ok) return res.data;
      var err = new Error((res && res.error) || 'Lỗi không xác định');
      err.code = res && res.code;
      if (err.code === 'AUTH') { logoutLocal(); toast(err.message, 'err'); }
      throw err;
    }, function (e) { if (!opts.silent) busy(false); throw e; });
  }
  function fail(e) { toast(e.message, 'err'); throw e; }
  function has(perm) { return !!(S.boot && S.boot.user.perms[perm]); }
  var LABEL_FALLBACK = { PayCycle: { DAU_THANG: 'Đầu tháng (trả trước)', CUOI_THANG: 'Cuối tháng (trả sau)', TUY_CHINH: 'Tuỳ chỉnh ngày' } };
  function listOf(name) {
    var l = S.boot.lists.filter(function (x) { return x.ListName === name; }).sort(function (a, b) { return a.Order - b.Order; });
    if (!l.length && LABEL_FALLBACK[name]) l = Object.keys(LABEL_FALLBACK[name]).map(function (k, i) { return { ListName: name, Value: k, Label: LABEL_FALLBACK[name][k], Order: i + 1 }; });
    return l;
  }
  function labelOf(name, value) { var l = listOf(name).filter(function (x) { return x.Value === value; })[0]; return l ? l.Label : value; }

  /* ------------------------------------------------------------ Form helper
   * field = { name, label, type:'text'|'number'|'select'|'textarea'|'check'|'date'|'password', options:[{value,label}], col, required, help, attrs } */
  function formHtml(fields, v) {
    v = v || {};
    return '<div class="row g-3">' + fields.map(function (f) {
      var val = v[f.name] == null ? (f.def == null ? '' : f.def) : v[f.name];
      var id = 'f-' + f.name;
      var req = f.required ? ' required' : '';
      var attrs = f.attrs || '';
      var input;
      if (f.type === 'select') {
        input = '<select class="form-select" id="' + id + '" name="' + f.name + '"' + req + ' ' + attrs + '>' +
          (f.placeholder ? '<option value="">' + esc(f.placeholder) + '</option>' : '') +
          f.options.map(function (o) { return '<option value="' + esc(o.value) + '"' + (String(o.value) === String(val) ? ' selected' : '') + '>' + esc(o.label) + '</option>'; }).join('') + '</select>';
      } else if (f.type === 'textarea') {
        input = '<textarea class="form-control" rows="' + (f.rows || 3) + '" id="' + id + '" name="' + f.name + '"' + req + ' ' + attrs + '>' + esc(val) + '</textarea>';
      } else if (f.type === 'check') {
        var on = val === '' ? f.def !== false : (val === true || String(val).toUpperCase() === 'TRUE');
        return '<div class="col-' + (f.col || 12) + '"><div class="form-check form-switch mt-2"><input class="form-check-input" type="checkbox" id="' + id + '" name="' + f.name + '"' + (on ? ' checked' : '') + ' ' + attrs + '>' +
          '<label class="form-check-label" for="' + id + '">' + esc(f.label) + '</label></div></div>';
      } else if (f.type === 'money') {
        input = '<div class="input-group"><input class="form-control money-input text-end" type="text" inputmode="numeric" id="' + id + '" name="' + f.name + '" value="' +
          (val === '' ? '' : esc(fmtThousands(num(val)))) + '"' + req + ' ' + attrs + '><span class="input-group-text">đ</span></div>';
      } else {
        input = '<input class="form-control" type="' + (f.type || 'text') + '" id="' + id + '" name="' + f.name + '" value="' + esc(val) + '"' + req + ' ' + attrs +
          (f.type === 'number' ? ' inputmode="numeric" min="0"' : '') + (f.placeholder ? ' placeholder="' + esc(f.placeholder) + '"' : '') + '>';
      }
      return '<div class="col-12 col-md-' + (f.col || 12) + '"><label class="form-label" for="' + id + '">' + esc(f.label) + (f.required ? ' *' : '') + '</label>' + input +
        (f.help ? '<div class="form-text">' + esc(f.help) + '</div>' : '') + '</div>';
    }).join('') + '</div>';
  }
  function readForm(root) {
    var o = {};
    $$('[name]', root).forEach(function (el) { o[el.name] = el.type === 'checkbox' ? el.checked : el.classList.contains('money-input') ? el.value.replace(/\D/g, '') : el.value.trim(); });
    return o;
  }
  function validForm(root) {
    var bad = $$('[required]', root).filter(function (el) { return !el.value.trim(); });
    bad.forEach(function (el) { el.classList.add('is-invalid'); el.addEventListener('input', function () { el.classList.remove('is-invalid'); }, { once: true }); });
    if (bad.length) { bad[0].focus(); toast('Vui lòng nhập đủ các ô bắt buộc.', 'err'); }
    return !bad.length;
  }

  /* ------------------------------------------------------------ Modal */
  var modal;
  function openModal(title, body, buttons, size) {
    $('#modal-title').textContent = title;
    $('#modal-body').innerHTML = body;
    var foot = $('#modal-foot');
    foot.innerHTML = '';
    (buttons || []).forEach(function (b) {
      var el = document.createElement('button');
      el.type = 'button'; el.className = 'btn ' + (b.cls || 'btn-light'); el.innerHTML = b.label;
      el.addEventListener('click', function () {
        if (!b.onClick) return modal.hide();
        el.disabled = true;
        Promise.resolve(b.onClick(el)).then(function (close) { if (close !== false) modal.hide(); })
          .catch(function () { /* đã báo lỗi */ }).then(function () { el.disabled = false; });
      });
      foot.appendChild(el);
    });
    foot.style.display = (buttons && buttons.length) ? '' : 'none';
    var dlg = $('#modal .modal-dialog');
    dlg.classList.remove('modal-lg', 'modal-xl'); if (size !== 'md') dlg.classList.add(size || 'modal-lg');
    modal = modal || new bootstrap.Modal($('#modal'));
    modal.show();
    return $('#modal-body');
  }

  /* ------------------------------------------------------------ Nén ảnh & upload */
  /** Thu ảnh về cạnh dài maxSide, JPEG quality → dataURL. PNG giữ nền trong nếu keepPng. */
  function compressImage(file, maxSide, quality, keepPng) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        var scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        var ctx = c.getContext('2d');
        var png = keepPng && file.type === 'image/png';
        if (!png) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve({ dataUrl: c.toDataURL(png ? 'image/png' : 'image/jpeg', quality), mimeType: png ? 'image/png' : 'image/jpeg' });
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Không đọc được ảnh ' + file.name)); };
      img.src = url;
    });
  }
  function readAsDataUrl(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(r.result); };
      r.onerror = function () { reject(new Error('Không đọc được file ' + file.name)); };
      r.readAsDataURL(file);
    });
  }
  /** Chuẩn bị 1 file để gửi: ảnh → nén; PDF → kiểm tra 10MB. */
  function prepareFile(file, opt) {
    opt = opt || {};
    if (/^image\//.test(file.type)) return compressImage(file, opt.maxSide || 1600, opt.quality || 0.75, opt.keepPng);
    if (file.type === 'application/pdf') {
      if (file.size > 10 * 1024 * 1024) return Promise.reject(new Error(file.name + ': PDF tối đa 10MB.'));
      return readAsDataUrl(file).then(function (d) { return { dataUrl: d, mimeType: 'application/pdf' }; });
    }
    return Promise.reject(new Error(file.name + ': chỉ nhận ảnh hoặc PDF.'));
  }
  /** Upload nhiều file, tối đa 3 file song song. onEach(i, status, result) để cập nhật tiến trình. */
  function uploadFiles(files, base, onEach) {
    var queue = files.map(function (f, i) { return { f: f, i: i }; });
    var results = [];
    function worker() {
      var job = queue.shift();
      if (!job) return Promise.resolve();
      onEach && onEach(job.i, 'Đang nén…');
      return prepareFile(job.f, base.prep).then(function (p) {
        onEach && onEach(job.i, 'Đang tải lên ' + Math.round(p.dataUrl.length * 0.75 / 1024) + 'KB…');
        var payload = Object.assign({}, base, { base64: p.dataUrl, mimeType: p.mimeType, seq: job.i + 1 }); delete payload.prep;
        return call('files.upload', payload, { silent: true });
      }).then(function (res) { results[job.i] = res; onEach && onEach(job.i, 'xong', res); },
              function (e) { results[job.i] = null; onEach && onEach(job.i, 'lỗi: ' + e.message); })
        .then(worker);
    }
    busy(true);
    return Promise.all([worker(), worker(), worker()]).then(function () { busy(false); return results; });
  }
  function loadThumbs(ids) {
    var need = ids.filter(function (id) { return id && !(id in S.thumbs); });
    if (!need.length) return Promise.resolve();
    return call('files.thumbs', { driveFileIds: need }, { silent: true }).then(function (map) {
      need.forEach(function (id) { S.thumbs[id] = map[id] || ''; });
    }).catch(function () { /* ảnh không quan trọng */ });
  }

  /* ------------------------------------------------------------ Đăng nhập */
  function showLogin() {
    $('#app-view').classList.add('d-none');
    $('#login-view').classList.remove('d-none');
    setTimeout(function () { $('#lg-user').focus(); }, 50);
  }
  function logoutLocal() { S.token = ''; S.boot = null; store.del('bh_token'); showLogin(); }

  $('#lg-eye').addEventListener('click', function () {
    var p = $('#lg-pass'); p.type = p.type === 'password' ? 'text' : 'password';
    this.innerHTML = '<i class="bi bi-eye' + (p.type === 'text' ? '-slash' : '') + '"></i>';
  });
  $('#login-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = $('#lg-btn'); btn.disabled = true; btn.textContent = 'Đang đăng nhập…'; $('#lg-err').textContent = '';
    rpc('auth.login', { username: $('#lg-user').value, password: $('#lg-pass').value }).then(function (res) {
      btn.disabled = false; btn.textContent = 'Đăng nhập';
      if (!res || !res.ok) { $('#lg-err').textContent = (res && res.error) || 'Đăng nhập thất bại.'; return; }
      S.token = res.data.token; store.set('bh_token', S.token); $('#lg-pass').value = '';
      start();
    }, function (e) {
      btn.disabled = false; btn.textContent = 'Đăng nhập'; $('#lg-err').textContent = e.message;
    });
  });
  $('#login-ver').textContent = 'Phiên bản ' + UI_VERSION;
  if (!API_READY) {
    $('#lg-err').innerHTML = 'Chưa kết nối máy chủ: mở <code>config.js</code> và điền <b>API_URL</b> là link Web App (…/exec).';
    $('#lg-btn').disabled = true;
  }

  /* ------------------------------------------------------------ Khung app & điều hướng */
  var NAV = [
    { id: 'dashboard', icon: 'speedometer2', label: 'Tổng quan',     perm: null,          mobile: true },
    { id: 'rooms',     icon: 'grid-3x3-gap', label: 'Sơ đồ phòng',   perm: 'ROOM_VIEW',   mobile: true },
    { id: 'tenants',   icon: 'people',       label: 'Khách thuê',    perm: 'TENANT_VIEW', mobile: true },
    { id: 'residence', icon: 'card-checklist', label: 'Tạm trú',     perm: 'RESIDENCE_EDIT' },
    { id: 'meters',    icon: 'lightning-charge', label: 'Chốt điện nước', perm: 'METER_EDIT', soon: 'GĐ3' },
    { id: 'invoices',  icon: 'receipt',      label: 'Hoá đơn',       perm: 'INVOICE_EDIT', soon: 'GĐ3', mobile: true },
    { id: 'expenses',  icon: 'wallet2',      label: 'Chi phí',       perm: 'EXPENSE_ADD', soon: 'GĐ4' },
    { id: 'reports',   icon: 'bar-chart',    label: 'Báo cáo',       perm: 'REPORT_VIEW', soon: 'GĐ4' },
    { id: 'config',    icon: 'gear',         label: 'Cấu hình',      perm: 'CONFIG_EDIT', mobile: true }
  ];
  var VIEWS = {};

  function renderShell() {
    var b = S.boot;
    var items = NAV.filter(function (n) { return !n.perm || has(n.perm); });
    $('#side-nav').innerHTML = items.map(function (n) {
      return '<a class="nav-link" href="#' + n.id + '" data-nav="' + n.id + '"><i class="bi bi-' + n.icon + '"></i>' + esc(n.label) +
        (n.soon ? '<span class="soon">' + n.soon + '</span>' : '') + '</a>';
    }).join('');
    $('#bottom-nav').innerHTML = items.filter(function (n) { return n.mobile; }).slice(0, 5).map(function (n) {
      return '<a href="#' + n.id + '" data-nav="' + n.id + '"><i class="bi bi-' + n.icon + '"></i>' + esc(n.label) + '</a>';
    }).join('');
    $('#side-user').textContent = b.user.fullName || b.user.username;
    var same = b.version === UI_VERSION;
    $('#app-ver').innerHTML = same ? 'Phiên bản ' + esc(UI_VERSION) :
      '<span class="ver-warn" title="Giao diện và Apps Script khác phiên bản">Giao diện v' + esc(UI_VERSION) + ' · Máy chủ v' + esc(b.version || '?') + '</span>';
    $('#side-name').textContent = b.settings.APP_NAME || 'Quản lý phòng trọ';
    document.title = b.settings.APP_NAME || 'Quản lý phòng trọ';
    if (b.logo) {
      ['#side-logo', '#login-logo'].forEach(function (s) { $(s).innerHTML = '<img src="' + b.logo + '" alt="">'; });
    }
  }

  function route() {
    if (!S.boot) return;
    var id = (location.hash || '#dashboard').slice(1).split('/')[0];
    var nav = NAV.filter(function (n) { return n.id === id; })[0];
    if (id !== 'account' && (!nav || (nav.perm && !has(nav.perm)))) { id = 'dashboard'; nav = NAV[0]; }
    S.view = id;
    $$('[data-nav]').forEach(function (a) { a.classList.toggle('active', a.getAttribute('data-nav') === id); });
    $('#page-title').textContent = id === 'account' ? 'Tài khoản' : nav.label;
    $('#topbar-actions').innerHTML = '';
    var view = VIEWS[id] || soonView(nav);
    view($('#content'));
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-act="logout"]');
    if (!a) return;
    e.preventDefault();
    call('auth.logout').catch(function () { /* bỏ qua */ }).then(logoutLocal);
  });

  function start() {
    $('#login-view').classList.add('d-none');
    $('#app-view').classList.remove('d-none');
    $('#content').innerHTML = '<div class="row g-3">' + [1, 2, 3, 4].map(function () { return '<div class="col-6 col-lg-3"><div class="skeleton"></div></div>'; }).join('') + '</div>';
    return call('bootstrap').then(function (b) {
      // phòng khi server còn bản cũ hoặc Sheet có dòng trống: bỏ bản ghi không có mã
      b.blocks = b.blocks.filter(function (x) { return String(x.BlockID || '').trim(); });
      b.rooms = b.rooms.filter(function (x) { return String(x.RoomID || '').trim(); });
      b.fees = b.fees.filter(function (x) { return String(x.FeeID || '').trim(); });
      S.boot = b;
      renderShell();
      route();
    }).catch(function (e) { if (e.code !== 'AUTH') { toast(e.message, 'err'); } });
  }
  function reboot() { return call('bootstrap', {}, { silent: true }).then(function (b) { S.boot = b; renderShell(); }); }

  function soonView(nav) {
    return function (el) {
      el.innerHTML = '<div class="card"><div class="empty"><i class="bi bi-cone-striped"></i><div class="fw-semibold mb-1">' + esc(nav.label) +
        '</div>Chức năng này sẽ có ở ' + esc((nav.soon || '').replace('GĐ', 'giai đoạn ')) + '.</div></div>';
    };
  }

  /* ------------------------------------------------------------ Helpers dữ liệu */
  function blocksActive() { return S.boot.blocks.filter(function (b) { return b.Active !== false && String(b.Active).toUpperCase() !== 'FALSE'; }); }
  function blockName(id) { var b = S.boot.blocks.filter(function (x) { return x.BlockID === id; })[0]; return b ? b.BlockName : id; }
  function isOn(v) { return !(v === false || String(v).toUpperCase() === 'FALSE'); }
  function isFree(f) { return f.Free === true || String(f.Free).toUpperCase() === 'TRUE'; }
  function feeKey(f) { return String(f.FeeName || '').trim().toLowerCase(); }
  function feeOrder(a, b) { return (num(a.Order) || 99) - (num(b.Order) || 99) || String(a.FeeName).localeCompare(String(b.FeeName), 'vi'); }
  var TODAY = new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10);
  /** Giá dãy đang áp dụng: mỗi tên khoản lấy dòng có ngày áp dụng gần nhất ≤ hôm nay. */
  function blockFeeList(blockId) {
    var pick = {};
    S.boot.fees.forEach(function (f) {
      if (f.Scope !== 'BLOCK' || f.ScopeID !== blockId || !isOn(f.Active)) return;
      if (f.EffectiveFrom && String(f.EffectiveFrom) > TODAY) return;
      var k = feeKey(f);
      if (!pick[k] || String(f.EffectiveFrom) > String(pick[k].EffectiveFrom)) pick[k] = f;
    });
    return Object.keys(pick).map(function (k) { return pick[k]; }).sort(feeOrder);
  }
  /** Bảng giá của 1 phòng: giá dãy, khoản cùng tên ở phòng ghi đè. Mỗi dòng có _room=true nếu là giá riêng. */
  function roomFeeList(room) {
    var map = {};
    blockFeeList(room.BlockID).forEach(function (f) { map[feeKey(f)] = Object.assign({ _base: f }, f); });
    S.boot.fees.forEach(function (f) {
      if (f.Scope !== 'ROOM' || f.ScopeID !== room.RoomID || !isOn(f.Active)) return;
      var k = feeKey(f);
      map[k] = Object.assign({ _room: true, _base: map[k] && map[k]._base }, f);
    });
    return Object.keys(map).map(function (k) { return map[k]; }).sort(feeOrder);
  }
  function blockOf(id) { return S.boot.blocks.filter(function (x) { return x.BlockID === id; })[0] || {}; }
  function payCycleText(o) {

  function feePrice(f) {

  function statusPill(s) { return '<span class="st st-' + esc(s || 'TRONG') + '">' + esc(labelOf('RoomStatus', s || 'TRONG')) + '</span>'; }

  /* ------------------------------------------------------------ Tổng quan */
  VIEWS.dashboard = function (el) {

      return '<div class="col-6 col-lg-3"><div class="card kpi h-100"><i class="bi bi-' + icon + ' ico"></i><div class="label">' + label + '</div><div class="value">' + value + '</div><div class="sub">' + sub + '</div></div></div>';
    };
    var html = '<div class="row g-3 mb-3">' +
      kpi('Tổng số phòng', rooms.length, blocksActive().length + ' dãy', 'buildings') +

      kpi('Đang thuê / đã cọc', count('DANG_THUE') + ' / ' + count('DA_COC'), 'lấp đầy ' + occ + '%', 'people') +
      kpi('Bảo trì', count('BAO_TRI'), 'tạm ngưng cho thuê', 'tools') + '</div>';
    html += '<div class="row g-3">' + blocksActive().map(function (b) {
      var rs = rooms.filter(function (r) { return r.BlockID === b.BlockID; });
      var c = function (s) { return rs.filter(function (r) { return r.Status === s; }).length; };
      return '<div class="col-12 col-md-6 col-xl-4"><div class="card h-100"><div class="card-header"><i class="bi bi-house"></i>' + esc(b.BlockName) +
        '<a class="ms-auto small" href="#rooms/' + esc(b.BlockID) + '">Xem phòng</a></div><div class="card-body">' +
        '<div class="text-muted small mb-2"><i class="bi bi-geo-alt"></i> ' + esc(b.Address || 'Chưa có địa chỉ') + '</div>' +
        '<div class="d-flex flex-wrap gap-2">' + ['TRONG', 'DA_COC', 'DANG_THUE', 'BAO_TRI'].map(function (s) { return statusPill(s).replace('</span>', ': ' + c(s) + '</span>'); }).join('') + '</div>' +
        '</div></div></div>';
    }).join('') + '</div>';
    if (!blocksActive().length) {
      html += '<div class="card"><div class="empty"><i class="bi bi-house-add"></i>Chưa có dãy phòng nào.' +
        (has('CONFIG_EDIT') ? '<div class="mt-2"><a class="btn btn-primary btn-sm" href="#config">Vào Cấu hình để thêm dãy</a></div>' : '') + '</div></div>';
    }

    box.innerHTML = '<div class="section-title"><i class="bi bi-bell"></i> Cảnh báo</div><div class="row g-3" id="alert-list"><div class="col-12"><div class="skeleton"></div></div></div>';
    el.insertBefore(box, el.children[1] || null);
    var local = configAlerts();
    drawAlerts(local, true);
    call('dashboard.alerts', {}, { silent: true }).then(function (server) {
      if (S.view === 'dashboard') drawAlerts(server.concat(local), false);
    }).catch(function () { if (S.view === 'dashboard') drawAlerts(local, false); });
  };

  var LEVEL_ORDER = { danger: 0, warning: 1, info: 2 };
  function drawAlerts(list, loading) {
    var box = $('#alert-list'); if (!box) return;
    list = list.slice().sort(function (a, b) { return LEVEL_ORDER[a.level] - LEVEL_ORDER[b.level]; });
    if (!list.length) {
      box.innerHTML = loading ? '<div class="col-12"><div class="skeleton"></div></div>' :
        '<div class="col-12"><div class="card alert-card lv-ok"><div class="card-body d-flex align-items-center gap-2"><i class="bi bi-check-circle ico"></i>Không có cảnh báo nào. Mọi thứ đang ổn.</div></div></div>';
      return;
    }
    box.innerHTML = list.map(function (a) {
      var more = a.items.length > 4 ? '<li class="text-muted">+ ' + (a.items.length - 4) + ' mục nữa</li>' : '';
      return '<div class="col-12 col-md-6 col-xl-4"><a class="card alert-card lv-' + a.level + ' h-100" href="#' + esc(a.link || 'dashboard') + '"><div class="card-body">' +
        '<div class="d-flex align-items-start gap-2"><i class="bi bi-' + esc(a.icon) + ' ico"></i><div class="flex-grow-1 min-w-0">' +
        '<div class="t">' + esc(a.title) + '<span class="cnt">' + a.items.length + '</span></div>' +
        '<ul>' + a.items.slice(0, 4).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + more + '</ul></div></div></div></a></div>';
    }).join('') + (loading ? '<div class="col-12 col-md-6 col-xl-4"><div class="skeleton"></div></div>' : '');

  /** Cảnh báo tính ngay từ cấu hình đã tải (không gọi server). */
  function configAlerts() {
    var out = [];
    var push = function (level, icon, title, items, link) { if (items.length) out.push({ level: level, icon: icon, title: title, items: items, link: link }); };
    var blocks = blocksActive();
    var rooms = S.boot.rooms.filter(function (r) { return isOn(r.Active); });
    if (has('CONFIG_EDIT')) {
      push('warning', 'bank', 'Dãy chưa có tài khoản nhận tiền',
        blocks.filter(function (b) { return !b.BankBin || !b.BankAccountNo; }).map(function (b) { return b.BlockName + ': hoá đơn sẽ không có mã QR'; }), 'config/blocks');
      var feeItems = [];
      blocks.forEach(function (b) {
        var fs = blockFeeList(b.BlockID);
        if (!fs.length) return feeItems.push(b.BlockName + ': chưa có khoản phí nào');
        // giá 0đ là cố ý (vẫn in dòng 0đ trên hoá đơn) nên không cảnh báo
        var names = fs.map(function (f) { return f.CalcType; });
        if (names.indexOf('METER_ELEC') < 0) feeItems.push(b.BlockName + ': chưa có giá điện');
      });
      push('warning', 'tags', 'Bảng giá chưa đủ', feeItems, 'config/fees');
      if (!S.boot.settings.WATERMARK_PAID_ID) push('info', 'droplet-half', 'Chưa tạo watermark hoá đơn', ['Vào Cấu hình → Hệ thống → Tạo lại watermark'], 'config/system');
    }
    if (has('ROOM_EDIT')) {
      push('warning', 'cash', 'Phòng chưa có giá thuê', rooms.filter(function (r) { return !num(r.BaseRent); }).map(function (r) { return blockName(r.BlockID) + ' · P.' + r.RoomNo; }), 'rooms');
      push('info', 'camera', 'Phòng trống chưa có ảnh (chưa đăng tin được)', rooms.filter(function (r) { return r.Status === 'TRONG' && !r.CoverFileId; }).map(function (r) { return blockName(r.BlockID) + ' · P.' + r.RoomNo; }), 'rooms');
    }
    push('info', 'tools', 'Phòng đang bảo trì', rooms.filter(function (r) { return r.Status === 'BAO_TRI'; }).map(function (r) { return blockName(r.BlockID) + ' · P.' + r.RoomNo; }), 'rooms');
    return out;
  }

  function drawRooms() {
    var list = $('#room-list'); if (!list) return;
    var q = roomFilter.q;
    var rooms = S.boot.rooms.filter(function (r) {
      return (!roomFilter.block || r.BlockID === roomFilter.block) && (!roomFilter.status || r.Status === roomFilter.status) &&
        (!q || (r.RoomNo + ' ' + r.RoomID + ' ' + (r.WifiSSID || '') + ' ' + (r.Amenities || '')).toLowerCase().indexOf(q) >= 0);
    });
    if (!rooms.length) { list.innerHTML = '<div class="card"><div class="empty"><i class="bi bi-search"></i>Không có phòng phù hợp.</div></div>'; return; }
    var byBlock = {};
    rooms.forEach(function (r) { (byBlock[r.BlockID] = byBlock[r.BlockID] || []).push(r); });
    list.innerHTML = Object.keys(byBlock).map(function (bid) {
      var floors = {};
      byBlock[bid].forEach(function (r) { (floors[r.Floor || '—'] = floors[r.Floor || '—'] || []).push(r); });
      return '<div class="mb-4"><div class="block-head"><h3>' + esc(blockName(bid)) + '</h3><span class="text-muted small">' + byBlock[bid].length + ' phòng</span></div>' +
        Object.keys(floors).sort().map(function (fl) {
          return '<div class="floor-label">Tầng ' + esc(fl) + '</div><div class="room-grid">' +
            floors[fl].sort(function (a, b) { return String(a.RoomNo).localeCompare(String(b.RoomNo), 'vi', { numeric: true }); }).map(roomCard).join('') + '</div>';
        }).join('') + '</div>';
    }).join('');

  }

  function roomCard(r) {
    return '<div class="room-card s-' + esc(r.Status) + (isOn(r.Active) ? '' : ' off') + '" data-id="' + esc(r.RoomID) + '">' +
      '<div class="d-flex justify-content-between align-items-start"><div class="no">' + esc(r.RoomNo) + '</div>' + statusPill(r.Status) + '</div>' +
      '<div class="meta">' + [r.AreaM2 ? esc(r.AreaM2) + ' m²' : '', r.MaxPeople ? 'tối đa ' + esc(r.MaxPeople) + ' người' : ''].filter(Boolean).join(' · ') + '&nbsp;</div>' +
      '<div class="price text-nowrap">' + vnd(r.BaseRent) + '<span class="text-muted fw-normal small">/th</span></div></div>';
  }

  function findRoom(id) { return S.boot.rooms.filter(function (r) { return r.RoomID === id; })[0]; }

  function roomDetail(id) {
    var r = findRoom(id);
    var b = blockOf(r.BlockID);
    var fees = roomFeeList(r);
    var row = function (k, v) { return '<tr><td class="text-muted" style="width:40%">' + k + '</td><td>' + v + '</td></tr>'; };
    var body =
      '<ul class="nav nav-tabs mb-3"><li class="nav-item"><a class="nav-link active" data-tab="info" href="javascript:void 0">Thông tin</a></li>' +
      '<li class="nav-item"><a class="nav-link" data-tab="photos" href="javascript:void 0">Ảnh phòng</a></li></ul>' +
      '<div data-pane="info"><table class="table table-sm">' +
      row('Dãy', esc(b.BlockName)) + row('Trạng thái', statusPill(r.Status)) + row('Tầng', esc(r.Floor)) +
      row('Diện tích', r.AreaM2 ? esc(r.AreaM2) + ' m²' : '') + row('Số người tối đa', esc(r.MaxPeople)) +

      }).join('') + '</table>' : '<div class="text-muted small">Chưa cấu hình giá dịch vụ cho dãy này.</div>') +
      '</div><div data-pane="photos" class="d-none"><div id="room-photos"><div class="skeleton"></div></div></div>';
    var buttons = [];

    if (has('TENANT_EDIT') && r.Status === 'TRONG') buttons.push({ label: '<i class="bi bi-person-plus"></i> Cho thuê / nhận cọc', cls: 'btn-primary', onClick: function () { loadP2().then(function () { nextModal(function () { contractForm(r); }); }).catch(fail); } });
    buttons.push({ label: 'Đóng' });
    var root = openModal('Phòng ' + r.RoomNo + ' · ' + (b.BlockName || ''), body, buttons);

        '<div class="small text-primary mt-1">Xem hợp đồng <i class="bi bi-chevron-right"></i></div></div>';

  function roomPhotos(r) {

  /** Vẽ watermark chéo (logo + chữ, không ghi trạng thái) trên nền trong suốt, khổ A4 150dpi. */
  function drawWatermark(text, logoImg) {
    var c = document.createElement('canvas');
    c.width = 1240; c.height = 1754;
    var g = c.getContext('2d');
    g.translate(c.width / 2, c.height / 2);
    g.rotate(-Math.PI / 6);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.globalAlpha = 0.07;
    if (logoImg) { var w = 520, h = w * logoImg.height / logoImg.width; g.drawImage(logoImg, -w / 2, -h / 2 - 300, w, h); }
    g.fillStyle = '#0f4c5c';
    g.font = 'bold 150px Arial, sans-serif';
    var size = 150; while (g.measureText(text).width > 1500 && size > 60) { size -= 10; g.font = 'bold ' + size + 'px Arial, sans-serif'; }
    g.fillText(text, 0, logoImg ? 40 : 0);
    return c;
  }
  /** 1 ảnh watermark dùng chung cho mọi hoá đơn (lưu vào cả 2 khoá cũ để server không phải đổi). */
  function makeWatermarks() {

      if (!S.boot.logo) return resolve(null);
      var img = new Image(); img.onload = function () { resolve(img); }; img.onerror = function () { resolve(null); }; img.src = S.boot.logo;
    });
    return loadLogo.then(function (logo) {
      var canvas = drawWatermark(text, logo);
      var prev = $('#wm-preview'); if (prev) { prev.width = 248; prev.height = 351; prev.getContext('2d').drawImage(canvas, 0, 0, 248, 351); }
      busy(true);
      return call('files.upload', { entityType: 'SYSTEM', entityId: 'WATERMARK', docType: 'WATERMARK', base64: canvas.toDataURL('image/png'), mimeType: 'image/png', seq: 1 }, { silent: true })
        .then(function (res) { return call('settings.save', { WATERMARK_PAID_ID: res.driveFileId, WATERMARK_UNPAID_ID: res.driveFileId }, { silent: true }); })
        .then(function (st) { busy(false); S.boot.settings = st; toast('Đã tạo watermark.', 'ok'); }, function (e) { busy(false); throw e; });
    });
  }

  function bindPersonRows(box) {

  /** Đọc các dòng người ở; tạo/cập nhật khách, tải giấy tờ đã chọn, rồi trả về [{TenantID, Relation}]. */
  function resolvePeople(box) {
    var rows = $$('.person-row', box).map(function (row) {
      var g = function (k) { var el = $('[data-k="' + k + '"]', row); return el ? el.value.trim() : ''; };
      var id = {}; ID_KEYS.forEach(function (k) { if ($('[data-k="' + k + '"]', row)) id[k] = g(k); });
      return { pick: g('pick'), FullName: g('FullName'), Phone: g('Phone'), Relation: g('Relation'), id: id, files: row._files || {} };
    });

    if (bad.length) return Promise.reject(new Error('Nhập họ tên cho khách mới (hoặc chọn khách có sẵn).'));
    var badId = rows.filter(function (r) { var n = String(r.id.IdNo || '').replace(/\D/g, ''); return n && !/^(\d{9}|\d{12})$/.test(n); });
    if (badId.length) return Promise.reject(new Error('Số CCCD phải có 12 chữ số (CMND cũ 9 số).'));

    return rows.reduce(function (p, r) {
      return p.then(function () {
        var save;
        if (r.pick === 'NEW') save = call('tenants.save', Object.assign({ FullName: r.FullName, Phone: r.Phone }, r.id));
        else {
          var t = tenantOf(r.pick);
          var changed = Object.keys(r.id).some(function (k) { return r.id[k] && r.id[k] !== String(t[k] || '').slice(0, k === 'IdNo' || k === 'Gender' || k === 'IdIssuePlace' || k === 'PermanentAddress' ? 999 : 10); });

      var opts = [];
      S.p2.contracts.filter(function (c) { return c.Status === 'DANG_THUE'; }).forEach(function (c) {
        membersOf(c.ContractID).forEach(function (m) { opts.push({ value: c.ContractID + '|' + m.TenantID, label: tenantOf(m.TenantID).FullName + ' · ' + roomLabel(c.RoomID) }); });
      });
      if (!opts.length) return toast('Chưa có ai đang thuê.', 'err');
      fields.push({ name: 'who', label: 'Người', type: 'select', col: 8, required: true, options: opts });
      fields.push({ name: 'Type', label: 'Loại', type: 'select', col: 4, options: listOf('ResidenceType').map(function (x) { return { value: x.Value, label: x.Label }; }) });
    }
    fields = fields.concat([
      { name: 'Status', label: 'Trạng thái', type: 'select', col: 6, options: listOf('ResidenceStatus').map(function (x) { return { value: x.Value, label: x.Label }; }) },
      { name: 'SubmitDate', label: 'Ngày nộp', type: 'date', col: 6 },
      { name: 'ApproveDate', label: 'Ngày duyệt', type: 'date', col: 6 },
      { name: 'ExpiryDate', label: isNew ? 'Đến ngày' : 'Ngày hết hạn', type: 'date', col: 6 },
      { name: 'MissingDocs', label: 'Giấy tờ còn thiếu', placeholder: 'Giấy kết hôn, xác nhận cư trú…' },
      { name: 'Note', label: 'Ghi chú', type: 'textarea', rows: 2 },
      { name: 'Done', label: 'Đã xử lý xong', type: 'check', def: false }
    ]);
    var t = r ? tenantOf(r.TenantID) : null, c = r ? contractOfRes(r) : null;
    var body = (r ? '<div class="mb-3"><div class="fw-semibold">' + esc(t.FullName) + ' ' + tel(t.Phone) + '</div><div class="small text-muted">' +
        esc(labelOf('ResidenceType', r.Type)) + (c ? ' · ' + esc(roomLabel(c.RoomID)) : '') + '</div></div>' : '') +
      '<form id="rs-form">' + formHtml(fields, r || { Type: 'TAM_VANG', Status: 'CHUA_NOP', Done: false }) + '</form>' +
      (c ? '<div class="fw-semibold mt-4 mb-2">Hồ sơ tạm trú đã nộp</div><div id="rs-files"></div>' : '');
    var root = openModal(isNew ? 'Thêm tạm vắng / tạm trú' : 'Hồ sơ ' + labelOf('ResidenceType', r.Type).toLowerCase(), body, [
      { label: 'Huỷ' },
      { label: 'Lưu', cls: 'btn-primary', onClick: function () {
        var form = $('#rs-form', root); if (!validForm(form)) return false;
        var d = readForm(form);
        if (isNew) { var w = d.who.split('|'); d.ContractID = w[0]; d.TenantID = w[1]; delete d.who; } else d.ResID = r.ResID;
        return call('residence.save', d).then(function (res) { setP2(res); toast('Đã lưu hồ sơ.', 'ok'); redrawView(); }).catch(fail);
      } }
    ]);
    if (c) filesBox($('#rs-files', root), 'CONTRACT', c.ContractID, ['TAMTRU'], true);
  }

  /* ------------------------------------------------------------ Tài khoản */
  VIEWS.account = function (el) {
    var u = S.boot.user;
    el.innerHTML = '<div class="row g-3"><div class="col-12 col-lg-5"><div class="card"><div class="card-header">Thông tin</div><div class="card-body">' +
      '<div class="fw-semibold fs-5">' + esc(u.fullName) + '</div><div class="text-muted">' + esc(u.username) + ' · ' + esc(ROLE_LABEL[u.role] || u.role) + '</div>' +
      '<div class="small mt-2">Dãy được giao: ' + esc(u.scope === '*' ? 'Tất cả' : u.scope) + '</div>' +
      '<button class="btn btn-outline-danger btn-sm mt-3" data-act="logout"><i class="bi bi-box-arrow-right"></i> Đăng xuất</button></div></div></div>' +
      '<div class="col-12 col-lg-7"><div class="card"><div class="card-header">Đổi mật khẩu</div><div class="card-body"><form id="pw-form">' + formHtml([
        { name: 'oldPassword', label: 'Mật khẩu hiện tại', type: 'password', required: true, attrs: 'autocomplete="current-password"' },
        { name: 'newPassword', label: 'Mật khẩu mới (tối thiểu 8 ký tự)', type: 'password', col: 6, required: true, attrs: 'autocomplete="new-password"' },
        { name: 'confirm', label: 'Nhập lại mật khẩu mới', type: 'password', col: 6, required: true, attrs: 'autocomplete="new-password"' }
      ]) + '</form></div><div class="card-footer bg-white text-end"><button class="btn btn-primary" id="pw-save">Đổi mật khẩu</button></div></div></div></div>';
    $('#pw-save').onclick = function () {
      var form = $('#pw-form'); if (!validForm(form)) return;
      var d = readForm(form);
      if (d.newPassword !== d.confirm) return toast('Mật khẩu nhập lại không khớp.', 'err');
      call('auth.changePassword', d).then(function () { form.reset(); toast('Đã đổi mật khẩu.', 'ok'); }).catch(fail);
    };
  };

  /* ------------------------------------------------------------ Khởi động */
  if (S.token) start(); else showLogin();
})();
</script>
