<!DOCTYPE html>
<html lang="vi">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <?!= include('Stylesheet'); ?>
</head>
<body>
  <div id="busy"></div>

  <!-- ================= Đăng nhập ================= -->
  <section id="login-view" class="d-none">
    <form class="login-card" id="login-form" autocomplete="on">
      <div class="brand-logo" id="login-logo"><i class="bi bi-house-door-fill"></i></div>
      <h1><?= appName ?></h1>
      <p class="sub">Đăng nhập để tiếp tục</p>
      <div class="mb-3">
        <label class="form-label" for="lg-user">Tên đăng nhập</label>
        <div class="lc-field"><i class="bi bi-person"></i><input id="lg-user" name="username" autocomplete="username" required autocapitalize="none"></div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="lg-pass">Mật khẩu</label>
        <div class="lc-field"><i class="bi bi-lock"></i><input id="lg-pass" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="btn btn-sm btn-link text-muted" id="lg-eye" aria-label="Hiện mật khẩu"><i class="bi bi-eye"></i></button></div>
      </div>
      <div class="text-danger small mb-2" id="lg-err"></div>
      <div class="app-ver text-center text-muted mt-3" id="login-ver"></div>
      <button class="btn btn-primary w-100 py-2 fw-semibold" id="lg-btn">Đăng nhập</button>
    </form>
  </section>

  <!-- ================= Trang khách tự điền thông tin (link đăng ký, không cần đăng nhập) ================= -->
  <section id="intake-view" class="d-none"></section>

  <!-- ================= App ================= -->
  <div id="app-view" class="d-none">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo" id="side-logo"><i class="bi bi-house-door-fill"></i></div>
        <div><div class="brand-name" id="side-name"><?= appName ?></div><div class="brand-sub">Quản lý phòng trọ</div></div>
      </div>
      <nav id="side-nav"></nav>
      <div class="user-box">
        <div class="fw-semibold text-white" id="side-user"></div>
        <div class="app-ver" id="app-ver"></div>
        <div class="d-flex gap-2 mt-1">
          <a href="#account" class="link-light small">Tài khoản</a>·<a href="#" class="link-light small" data-act="logout">Đăng xuất</a>
        </div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <h2 id="page-title">Tổng quan</h2>
        <div class="ms-auto d-flex align-items-center gap-2" id="topbar-actions"></div>
        <a href="#account" class="btn btn-sm btn-light d-lg-none" aria-label="Tài khoản"><i class="bi bi-person-circle"></i></a>
      </header>
      <div class="content" id="content"></div>
    </main>
    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>

  <div id="toast-wrap"></div>

  <!-- Modal dùng chung -->
  <div class="modal fade" id="modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down modal-lg">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="modal-title"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer" id="modal-foot"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <?!= include('JavaScript'); ?>
</body>
</html>
