# Tự cập nhật Apps Script khi merge vào main: clasp push (3 file trong dist/) + cập nhật bản triển khai đang chạy.
# Link /exec giữ nguyên. Cần secret CLASPRC_JSON (nội dung file ~/.clasprc.json sau khi chạy `clasp login`).
name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths: ['src/**', 'dist/**', 'scripts/build.js', '.clasp.json', '.github/workflows/deploy-apps-script.yml']
  workflow_dispatch:

concurrency:
  group: deploy-apps-script
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_ID: AKfycbwM56P5KE5pXmXaK8pkZwc4yMQ8_Kf-A4dFDDSGDsSH6j1XdEInxcJYKz6ePhit5fULXg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kiểm tra có secret
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::Chưa có secret CLASPRC_JSON (xem docs/TU-DONG-CAP-NHAT.md)"; exit 1; fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
      - name: Build 3 file
        run: node scripts/build.js
      - name: Cài clasp
        run: npm install -g @google/clasp@2.4.2
      - name: Đẩy code lên Apps Script
        run: clasp push --force
      - name: Cập nhật bản triển khai (giữ link /exec)
        run: |
          VER=$(node -p "require('./package.json').version")
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "v$VER (GitHub $GITHUB_SHA)"
