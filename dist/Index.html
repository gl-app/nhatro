<!DOCTYPE html>
<html lang="vi">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
/* Quản lý phòng trọ | Bootstrap 5.3 base, phong cách thẻ theo hong-lab */
:root {
  --brand: #0f4c5c; --brand-600: #0b3b48; --brand-50: #e7f1f3; --brand-100: #cfe3e7; --accent: #e36414;
  --bg: #f3f6f7; --surface: #fff; --text: #1f2933; --muted: #5f6b7a; --border: #dde3e8;
  --danger: #b42318; --danger-50: #fdecea; --success: #067647; --success-50: #e7f6ee; --warn: #b54708; --warn-50: #fef3e6;
  --info: #175cd3; --info-50: #eff4ff;
  --radius: 10px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --sidebar-w: 236px;
  --bs-primary: var(--brand); --bs-primary-rgb: 15,76,92;
  --bs-body-font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bs-body-color: var(--text); --bs-body-bg: var(--bg); --bs-border-color: var(--border);
}
html, body { background: var(--bg); color: var(--text); font-size: 14px; }
body { font-family: var(--bs-body-font-family); -webkit-font-smoothing: antialiased; }
.tabular { font-variant-numeric: tabular-nums; }
.text-muted { color: var(--muted) !important; }
a { color: var(--brand); }
.btn-primary { --bs-btn-bg: var(--brand); --bs-btn-border-color: var(--brand); --bs-btn-hover-bg: var(--brand-600); --bs-btn-hover-border-color: var(--brand-600);
  --bs-btn-active-bg: var(--brand-600); --bs-btn-disabled-bg: var(--brand); --bs-btn-disabled-border-color: var(--brand); }
.btn-outline-primary { --bs-btn-color: var(--brand); --bs-btn-border-color: var(--brand); --bs-btn-hover-bg: var(--brand); --bs-btn-hover-border-color: var(--brand);
  --bs-btn-active-bg: var(--brand); --bs-btn-active-border-color: var(--brand); }
.form-control:focus, .form-select:focus, .form-check-input:focus { border-color: var(--brand); box-shadow: 0 0 0 .2rem rgba(15,76,92,.15); }
.form-check-input:checked { background-color: var(--brand); border-color: var(--brand); }
.form-label { font-weight: 500; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }

/* ---------------- Login */
#login-view { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  background: radial-gradient(1200px 600px at 10% 0%, #1a6a7e 0%, transparent 60%), linear-gradient(160deg, #0f4c5c, #0b3b48); }
.login-card { width: 100%; max-width: 400px; background: #fff; border-radius: 16px; padding: 36px 32px 24px; box-shadow: 0 24px 64px rgba(6,30,38,.35); }
.login-card h1 { font-size: 22px; font-weight: 700; color: var(--brand); margin: 12px 0 4px; text-align: center; }
.login-card p.sub { text-align: center; color: var(--muted); margin-bottom: 20px; }
.brand-logo { width: 64px; height: 64px; border-radius: 16px; background: var(--brand-50); color: var(--brand); display: grid; place-items: center;
  margin: 0 auto; overflow: hidden; font-size: 28px; }
.brand-logo img { width: 100%; height: 100%; object-fit: contain; }
.lc-field { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 6px 0 14px; border: 1px solid #cbd5dc; border-radius: 10px; }
.lc-field:focus-within { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(15,76,92,.12); }
.lc-field i { color: var(--muted); }
.lc-field input { flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; font-size: 15px; background: transparent; }

/* ---------------- Shell */
.sidebar { position: fixed; inset: 0 auto 0 0; width: var(--sidebar-w); background: var(--brand); color: #d8e7ea; display: flex; flex-direction: column; z-index: 1030; }
.sidebar .brand { display: flex; gap: 10px; align-items: center; padding: 16px; border-bottom: 1px solid rgba(255,255,255,.08); }
.sidebar .brand .brand-logo { width: 38px; height: 38px; border-radius: 10px; font-size: 18px; margin: 0; background: #fff; }
.sidebar .brand-name { color: #fff; font-weight: 700; font-size: 13.5px; line-height: 1.2; }
.sidebar .brand-sub { font-size: 11px; opacity: .7; }
.sidebar nav { padding: 12px 10px; flex: 1; overflow-y: auto; }
.sidebar .nav-link { color: #d8e7ea; border-radius: 8px; padding: 9px 12px; display: flex; gap: 10px; align-items: center; font-weight: 500; margin-bottom: 2px; }
.sidebar .nav-link i { font-size: 17px; }
.sidebar .nav-link:hover { background: rgba(255,255,255,.08); color: #fff; }
.sidebar .nav-link.active { background: #fff; color: var(--brand); }
.sidebar .nav-link .soon { margin-left: auto; font-size: 10px; opacity: .6; }
.sidebar .user-box { padding: 12px 14px; border-top: 1px solid rgba(255,255,255,.08); font-size: 12.5px; }
.main { margin-left: var(--sidebar-w); min-height: 100vh; display: flex; flex-direction: column; }
.topbar { height: 56px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; padding: 0 20px;
  position: sticky; top: 0; z-index: 1020; }
.topbar h2 { font-size: 16px; font-weight: 600; margin: 0; }
.content { padding: 20px; flex: 1; }
.bottom-nav { display: none; }

@media (max-width: 991.98px) {
  .sidebar { display: none; }
  .main { margin-left: 0; padding-bottom: 64px; }
  .topbar { padding: 0 16px; }
  .content { padding: 16px; }
  .bottom-nav { display: flex; position: fixed; inset: auto 0 0 0; height: 60px; background: #fff; border-top: 1px solid var(--border); z-index: 1030;
    padding-bottom: env(safe-area-inset-bottom); }
  .bottom-nav a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--muted); text-decoration: none; }
  .bottom-nav a i { font-size: 20px; }
  .bottom-nav a.active { color: var(--brand); font-weight: 600; }
}

/* ---------------- Cards */
.card { border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-header { background: var(--surface); border-bottom: 1px solid var(--border); font-weight: 600; padding: 12px 16px; display: flex; align-items: center; gap: 8px; }
.kpi { padding: 14px 16px; }
.kpi .label { font-size: 12px; color: var(--muted); font-weight: 500; }
.kpi .value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
.kpi .sub { font-size: 12px; color: var(--muted); }
.kpi i.ico { float: right; font-size: 22px; color: var(--brand); opacity: .5; }
.empty { padding: 36px 16px; text-align: center; color: var(--muted); }
.empty i { font-size: 32px; display: block; margin-bottom: 8px; opacity: .6; }
.table { --bs-table-bg: transparent; margin-bottom: 0; }
.table > thead th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); font-weight: 600; background: #f8fafb; }
.table td, .table th { vertical-align: middle; }
.table-wrap { overflow-x: auto; }

/* ---------------- Status pills */
.st { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-TRONG { background: var(--success-50); color: var(--success); }
.st-DA_COC { background: var(--warn-50); color: var(--warn); }
.st-DANG_THUE { background: var(--info-50); color: var(--info); }
.st-BAO_TRI { background: #eef2f6; color: #475467; }
.st-OFF { background: var(--danger-50); color: var(--danger); }
.st-END { background: #f2f4f7; color: #667085; }
.c-card { border: 1px solid var(--border, #eaecf0); border-left: 4px solid #d0d5dd; border-radius: 10px; background: #fff; cursor: pointer; transition: box-shadow .15s; }
.c-card:hover { box-shadow: 0 4px 14px rgba(16,24,40,.08); }
.c-card.s-DA_COC { border-left-color: var(--warn); }
.c-card.s-DANG_THUE { border-left-color: var(--info); }
.person-row { border-top: 1px dashed #eaecf0; padding-top: 10px; margin-top: 10px; }
.person-row:first-child { border-top: 0; margin-top: 0; padding-top: 0; }

/* ---------------- Room map */
.block-head { display: flex; align-items: center; gap: 10px; margin: 4px 0 10px; }
.block-head h3 { font-size: 15px; font-weight: 700; margin: 0; }
.floor-label { font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 12px 0 6px; }
.room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.room-card { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 10px 12px; cursor: pointer; transition: transform .1s, box-shadow .1s; }
.room-card:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(16,24,40,.1); }
.room-card .no { font-size: 18px; font-weight: 700; }
.room-card .meta { font-size: 12px; color: var(--muted); }
.room-card .price { font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 4px; }
.room-card.s-TRONG { border-left-color: var(--success); }
.room-card.s-DA_COC { border-left-color: var(--warn); }
.room-card.s-DANG_THUE { border-left-color: var(--info); }
.room-card.s-BAO_TRI { border-left-color: #98a2b3; }
.room-card.off { opacity: .55; }
.filter-chips .btn { border-radius: 99px; }

/* ---------------- Photos / upload */
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.photo { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #eef2f6; border: 1px solid var(--border); }
.photo img { width: 100%; height: 100%; object-fit: cover; }
.photo .badge-cover { position: absolute; left: 4px; top: 4px; font-size: 10px; }
.photo .actions { position: absolute; right: 4px; bottom: 4px; display: flex; gap: 4px; }
.photo .actions button { width: 26px; height: 26px; padding: 0; border-radius: 6px; }
.upload-drop { border: 2px dashed var(--brand-100); border-radius: var(--radius); padding: 16px; text-align: center; color: var(--muted); cursor: pointer; background: #fafcfc; }
.upload-drop:hover { border-color: var(--brand); color: var(--brand); }
.upload-item { font-size: 12px; }

/* ---------------- Misc */
#toast-wrap { position: fixed; right: 16px; bottom: 16px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 991.98px) { #toast-wrap { bottom: 76px; left: 16px; } }
.toast-msg { background: #1f2933; color: #fff; padding: 10px 14px; border-radius: 8px; box-shadow: var(--shadow); font-size: 13px; max-width: 420px; }
.toast-msg.err { background: var(--danger); }
.toast-msg.ok { background: var(--success); }
#busy { position: fixed; inset: 0 0 auto 0; height: 3px; z-index: 3000; background: linear-gradient(90deg, transparent, var(--accent), transparent);
  background-size: 200% 100%; animation: busy 1s linear infinite; display: none; }
@keyframes busy { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.nav-tabs .nav-link { color: var(--muted); font-weight: 500; }
.nav-tabs .nav-link.active { color: var(--brand); font-weight: 600; }
.tab-scroll { overflow-x: auto; flex-wrap: nowrap; white-space: nowrap; }
.perm-table td, .perm-table th { text-align: center; }
.perm-table td:first-child, .perm-table th:first-child { text-align: left; }
.skeleton { background: linear-gradient(90deg, #eef2f6 25%, #f8fafb 50%, #eef2f6 75%); background-size: 200% 100%; animation: busy 1.2s linear infinite; border-radius: 8px; height: 88px; }
.money { font-variant-numeric: tabular-nums; }
.section-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 4px 0 10px; display: flex; gap: 6px; align-items: center; }
#alerts { margin-bottom: 1rem; }
.alert-card { display: block; text-decoration: none; color: inherit; border-left: 4px solid var(--brand); transition: box-shadow .15s; }
a.alert-card:hover { box-shadow: 0 4px 14px rgba(16,24,40,.08); color: inherit; }
.alert-card .card-body { padding: 12px 14px; }
.alert-card .ico { font-size: 20px; line-height: 1; margin-top: 1px; }
.alert-card .t { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; }
.alert-card .cnt { margin-left: auto; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 8px; background: #f2f4f7; }
.alert-card ul { margin: 6px 0 0; padding-left: 16px; font-size: 12.5px; color: #344054; }
.alert-card li { margin-bottom: 2px; overflow-wrap: anywhere; }
.alert-card.lv-danger { border-left-color: var(--danger); } .alert-card.lv-danger .ico, .alert-card.lv-danger .cnt { color: var(--danger); } .alert-card.lv-danger .cnt { background: var(--danger-50); }
.alert-card.lv-warning { border-left-color: var(--warn); } .alert-card.lv-warning .ico, .alert-card.lv-warning .cnt { color: var(--warn); } .alert-card.lv-warning .cnt { background: var(--warn-50); }
.alert-card.lv-info { border-left-color: var(--info); } .alert-card.lv-info .ico, .alert-card.lv-info .cnt { color: var(--info); } .alert-card.lv-info .cnt { background: var(--info-50); }
.alert-card.lv-ok { border-left-color: var(--success); } .alert-card.lv-ok .ico { color: var(--success); }
.min-w-0 { min-width: 0; }
.fee-row { display: grid; grid-template-columns: 1.3fr 1.4fr 1.2fr auto auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid #eaecf0; }
.fee-row .fr-free { margin: 0; white-space: nowrap; }
@media (max-width: 767.98px) {
  .fee-row { grid-template-columns: 1fr 1fr; }
  .fee-row .fr-name { grid-column: 1 / -1; }
}
.app-ver { font-size: 11px; color: rgba(255,255,255,.6); margin-top: 4px; }
#login-ver { color: var(--muted); }
.ver-warn { color: #fec84b; font-weight: 600; }
</style>

</head>
<body>
  <div id="busy"></div>

  <!-- ================= Đăng nhập ================= -->
  <section id="login-view" class="d-none">
    <form class="login-card" id="login-form" autocomplete="on">
      <div class="brand-logo" id="login-logo"><i class="bi bi-house-door-fill"></i></div>
      <h1><?= appName ?></h1>
      <p class="sub">Đăng nhập để tiếp tục</p>
      <div class="mb-3">
        <label class="form-label" for="lg-user">Tên đăng nhập</label>
        <div class="lc-field"><i class="bi bi-person"></i><input id="lg-user" name="username" autocomplete="username" required autocapitalize="none"></div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="lg-pass">Mật khẩu</label>
        <div class="lc-field"><i class="bi bi-lock"></i><input id="lg-pass" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="btn btn-sm btn-link text-muted" id="lg-eye" aria-label="Hiện mật khẩu"><i class="bi bi-eye"></i></button></div>
      </div>
      <div class="text-danger small mb-2" id="lg-err"></div>
      <div class="app-ver text-center text-muted mt-3" id="login-ver"></div>
      <button class="btn btn-primary w-100 py-2 fw-semibold" id="lg-btn">Đăng nhập</button>
    </form>
  </section>

  <!-- ================= App ================= -->
  <div id="app-view" class="d-none">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo" id="side-logo"><i class="bi bi-house-door-fill"></i></div>
        <div><div class="brand-name" id="side-name"><?= appName ?></div><div class="brand-sub">Quản lý phòng trọ</div></div>
      </div>
      <nav id="side-nav"></nav>
      <div class="user-box">
        <div class="fw-semibold text-white" id="side-user"></div>
        <div class="app-ver" id="app-ver"></div>
        <div class="d-flex gap-2 mt-1">
          <a href="#account" class="link-light small">Tài khoản</a>·<a href="#" class="link-light small" data-act="logout">Đăng xuất</a>
        </div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <h2 id="page-title">Tổng quan</h2>
        <div class="ms-auto d-flex align-items-center gap-2" id="topbar-actions"></div>
        <a href="#account" class="btn btn-sm btn-light d-lg-none" aria-label="Tài khoản"><i class="bi bi-person-circle"></i></a>
      </header>
      <div class="content" id="content"></div>
    </main>
    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>

  <div id="toast-wrap"></div>

  <!-- Modal dùng chung -->
  <div class="modal fade" id="modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down modal-lg">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="modal-title"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer" id="modal-foot"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script>
/* =====================================================================
 * JavaScript.html — Giao diện 1 trang: đăng nhập, khung app, Tổng quan,
 * Sơ đồ phòng, Cấu hình, Tài khoản. Không dùng framework, chỉ Bootstrap.
 * ===================================================================== */
(function () {
  'use strict';

  /* ------------------------------------------------------------ Tiện ích */
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var num = function (v) {
    if (typeof v === 'number') return v;
    var s = String(v == null ? '' : v).replace(/[^\d.,-]/g, '');
    s = /^-?\d{1,3}([.,]\d{3})+$/.test(s) ? s.replace(/[.,]/g, '') : s.replace(',', '.');
    var n = Number(s); return isNaN(n) ? 0 : n;
  };
  var fmtThousands = function (n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); };
  /* ô tiền: tự chèn dấu chấm hàng nghìn khi gõ */
  document.addEventListener('input', function (e) {
    if (!e.target.classList || !e.target.classList.contains('money-input')) return;
    var digits = e.target.value.replace(/\D/g, '');
    e.target.value = digits ? fmtThousands(Number(digits)) : '';
  });
  var vnd = function (n) { return Math.round(num(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' đ'; };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { /* bỏ qua */ } },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) { /* bỏ qua */ } }
  };

  /** Phiên bản giao diện, phải khớp APP_VERSION trong Schema.gs. */
  var UI_VERSION = '1.2.3';

  var S = { token: store.get('bh_token') || '', boot: null, thumbs: {}, view: '' };
  var busyCount = 0;
  function busy(on) { busyCount += on ? 1 : -1; $('#busy').style.display = busyCount > 0 ? 'block' : 'none'; }

  function toast(msg, kind) {
    var el = document.createElement('div');
    el.className = 'toast-msg ' + (kind || '');
    el.textContent = msg;
    $('#toast-wrap').appendChild(el);
    setTimeout(function () { el.remove(); }, kind === 'err' ? 6000 : 3000);
  }

  /* Hai cách chạy:
   *  - Trong Apps Script (doGet): gọi server bằng google.script.run.
   *  - Ngoài Apps Script (GitHub Pages): POST JSON tới Web App URL trong config.js (doPost). */
  var CFG = window.NHATRO_CONFIG || {};
  var IN_GAS = !!(window.google && google.script && google.script.run);
  var API_URL = String(CFG.API_URL || '');
  var API_READY = IN_GAS || /^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL);

  /** Gửi { action, token, payload } → Promise kết quả thô { ok, data | error, code }. */
  function rpc(action, payload) {
    if (IN_GAS) {
      return new Promise(function (resolve, reject) {
        var run = google.script.run.withSuccessHandler(resolve)
          .withFailureHandler(function (e) { reject(new Error(e && e.message ? e.message : 'Mất kết nối, vui lòng thử lại.')); });
        if (action === 'auth.login') run.login(payload.username, payload.password);
        else run.api(S.token, action, payload || {});
      });
    }
    if (!API_READY) return Promise.reject(new Error('Chưa cấu hình API_URL trong config.js.'));
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, CFG.REQUEST_TIMEOUT_MS || 60000) : null;
    return fetch(API_URL, {
      method: 'POST', redirect: 'follow', signal: ctrl ? ctrl.signal : undefined,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },          // text/plain: không preflight CORS
      body: JSON.stringify({ action: action, token: S.token, payload: payload || {} })
    }).then(function (r) {
      if (!r.ok) throw new Error('Máy chủ trả lỗi ' + r.status + '.');
      return r.json();
    }).catch(function (e) {

  /* ------------------------------------------------------------ Nén ảnh & upload */
  /** Thu ảnh về cạnh dài maxSide, JPEG quality → dataURL. PNG giữ nền trong nếu keepPng. */
  function compressImage(file, maxSide, quality, keepPng) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        var scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        var ctx = c.getContext('2d');
        var png = keepPng && file.type === 'image/png';
        if (!png) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve({ dataUrl: c.toDataURL(png ? 'image/png' : 'image/jpeg', quality), mimeType: png ? 'image/png' : 'image/jpeg' });
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Không đọc được ảnh ' + file.name)); };
      img.src = url;
    });
  }
  function readAsDataUrl(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(r.result); };
      r.onerror = function () { reject(new Error('Không đọc được file ' + file.name)); };
      r.readAsDataURL(file);
    });
  }
  /** Chuẩn bị 1 file để gửi: ảnh → nén; PDF → kiểm tra 10MB. */
  function prepareFile(file, opt) {
    opt = opt || {};
    if (/^image\//.test(file.type)) return compressImage(file, opt.maxSide || 1600, opt.quality || 0.75, opt.keepPng);
    if (file.type === 'application/pdf') {
      if (file.size > 10 * 1024 * 1024) return Promise.reject(new Error(file.name + ': PDF tối đa 10MB.'));
      return readAsDataUrl(file).then(function (d) { return { dataUrl: d, mimeType: 'application/pdf' }; });
    }
    return Promise.reject(new Error(file.name + ': chỉ nhận ảnh hoặc PDF.'));
  }
  /** Upload nhiều file, tối đa 3 file song song. onEach(i, status, result) để cập nhật tiến trình. */
  function uploadFiles(files, base, onEach) {
    var queue = files.map(function (f, i) { return { f: f, i: i }; });
    var results = [];
    function worker() {
      var job = queue.shift();
      if (!job) return Promise.resolve();
      onEach && onEach(job.i, 'Đang nén…');
      return prepareFile(job.f, base.prep).then(function (p) {
        onEach && onEach(job.i, 'Đang tải lên ' + Math.round(p.dataUrl.length * 0.75 / 1024) + 'KB…');
        var payload = Object.assign({}, base, { base64: p.dataUrl, mimeType: p.mimeType, seq: job.i + 1 }); delete payload.prep;
        return call('files.upload', payload, { silent: true });
      }).then(function (res) { results[job.i] = res; onEach && onEach(job.i, 'xong', res); },
              function (e) { results[job.i] = null; onEach && onEach(job.i, 'lỗi: ' + e.message); })
        .then(worker);
    }
    busy(true);
    return Promise.all([worker(), worker(), worker()]).then(function () { busy(false); return results; });
  }
  function loadThumbs(ids) {
    var need = ids.filter(function (id) { return id && !(id in S.thumbs); });

  function readEvnTiers(root) {
    return $$('[data-ep]', root).map(function (p, i) { var k = $('[data-ek="' + i + '"]', root); return { kwh: k ? Number(k.value) || 0 : 0, price: Number(p.value) || 0 }; });
  }
  function bindEvnCard(root, redraw) {
    var calc = function () {
      var o = $('#evn-old', root).value, n = $('#evn-new', root).value, out = $('#evn-out', root);
      if (o === '' || n === '') { out.innerHTML = '<span class="text-muted">Nhập chỉ số cũ và mới để xem tiền điện.</span>'; return; }
      if (Number(n) < Number(o)) { out.innerHTML = '<span class="text-danger">Chỉ số mới nhỏ hơn chỉ số cũ.</span>'; return; }
      var e = evnAmount(Number(n) - Number(o), readEvnTiers(root), Number($('#evn-vat', root).value) || 0);
      out.innerHTML = '<table class="table table-sm mb-0">' + e.rows.map(function (r) {
        return '<tr><td>Bậc ' + r.tier + '</td><td class="text-end">' + r.kwh + ' kWh × ' + vnd(r.price) + '</td><td class="text-end">' + vnd(r.amount) + '</td></tr>';
      }).join('') + '<tr><td colspan="2">Cộng ' + e.kwh + ' kWh</td><td class="text-end">' + vnd(e.subTotal) + '</td></tr>' +
        '<tr><td colspan="2">Thuế GTGT ' + e.vatPct + '%</td><td class="text-end">' + vnd(e.vat) + '</td></tr>' +
        '<tr><td colspan="2"><b>Tổng tiền điện</b></td><td class="text-end"><b id="evn-total">' + vnd(e.total) + '</b></td></tr></table>';
    };
    $$('input', $('#evn-card', root)).forEach(function (i) { i.addEventListener('input', calc); }); calc();
    var save = function (tiersStr, vat) {
      return call('settings.save', { EVN_TIERS: tiersStr, EVN_VAT: vat }).then(function (st) { S.boot.settings = st; toast('Đã lưu bậc giá điện.', 'ok'); redraw(); }).catch(fail);
    };
    $('#evn-save', root).onclick = function () {
      var t = readEvnTiers(root);
      save(t.map(function (x, i) { return (i === t.length - 1 ? 0 : x.kwh) + ':' + x.price; }).join(','), $('#evn-vat', root).value);
    };
    $('#evn-reset', root).onclick = function () { if (confirm('Đưa bậc giá điện về mặc định (giá EVN từ 10/05/2025, VAT 8%)?')) save(EVN_DEFAULT, 8); };
  }

  function statusPill(s) { return '<span class="st st-' + esc(s || 'TRONG') + '">' + esc(labelOf('RoomStatus', s || 'TRONG')) + '</span>'; }

  /* ------------------------------------------------------------ Tổng quan */
  VIEWS.dashboard = function (el) {
    var rooms = S.boot.rooms.filter(function (r) { return isOn(r.Active); });
    var count = function (s) { return rooms.filter(function (r) { return r.Status === s; }).length; };
    var occ = rooms.length ? Math.round((count('DANG_THUE') + count('DA_COC')) / rooms.length * 100) : 0;
    var kpi = function (label, value, sub, icon) {
      return '<div class="col-6 col-lg-3"><div class="card kpi h-100"><i class="bi bi-' + icon + ' ico"></i><div class="label">' + label + '</div><div class="value">' + value + '</div><div class="sub">' + sub + '</div></div></div>';
    };
    var html = '<div class="row g-3 mb-3">' +
      kpi('Tổng số phòng', rooms.length, blocksActive().length + ' dãy', 'buildings') +
      kpi('Phòng trống', count('TRONG'), 'sẵn sàng cho thuê', 'door-open') +
      kpi('Đang thuê / đã cọc', count('DANG_THUE') + ' / ' + count('DA_COC'), 'lấp đầy ' + occ + '%', 'people') +
      kpi('Bảo trì', count('BAO_TRI'), 'tạm ngưng cho thuê', 'tools') + '</div>';
    html += '<div class="row g-3">' + blocksActive().map(function (b) {
      var rs = rooms.filter(function (r) { return r.BlockID === b.BlockID; });
      var c = function (s) { return rs.filter(function (r) { return r.Status === s; }).length; };
      return '<div class="col-12 col-md-6 col-xl-4"><div class="card h-100"><div class="card-header"><i class="bi bi-house"></i>' + esc(b.BlockName) +
        '<a class="ms-auto small" href="#rooms/' + esc(b.BlockID) + '">Xem phòng</a></div><div class="card-body">' +
        '<div class="text-muted small mb-2"><i class="bi bi-geo-alt"></i> ' + esc(b.Address || 'Chưa có địa chỉ') + '</div>' +
        '<div class="d-flex flex-wrap gap-2">' + ['TRONG', 'DA_COC', 'DANG_THUE', 'BAO_TRI'].map(function (s) { return statusPill(s).replace('</span>', ': ' + c(s) + '</span>'); }).join('') + '</div>' +
        '</div></div></div>';
    }).join('') + '</div>';
    if (!blocksActive().length) {
      html += '<div class="card"><div class="empty"><i class="bi bi-house-add"></i>Chưa có dãy phòng nào.' +
        (has('CONFIG_EDIT') ? '<div class="mt-2"><a class="btn btn-primary btn-sm" href="#config">Vào Cấu hình để thêm dãy</a></div>' : '') + '</div></div>';
    }
    el.innerHTML = html;
    var box = document.createElement('div');
    box.id = 'alerts';
    box.innerHTML = '<div class="section-title"><i class="bi bi-bell"></i> Cảnh báo</div><div class="row g-3" id="alert-list"><div class="col-12"><div class="skeleton"></div></div></div>';
    el.insertBefore(box, el.children[1] || null);
    var local = configAlerts();
    drawAlerts(local, true);
    call('dashboard.alerts', {}, { silent: true }).then(function (server) {
      if (S.view === 'dashboard') drawAlerts(server.concat(local), false);
    }).catch(function () { if (S.view === 'dashboard') drawAlerts(local, false); });
  };

  var LEVEL_ORDER = { danger: 0, warning: 1, info: 2 };
  function drawAlerts(list, loading) {
    var box = $('#alert-list'); if (!box) return;
    list = list.slice().sort(function (a, b) { return LEVEL_ORDER[a.level] - LEVEL_ORDER[b.level]; });
    if (!list.length) {
      box.innerHTML = loading ? '<div class="col-12"><div class="skeleton"></div></div>' :
        '<div class="col-12"><div class="card alert-card lv-ok"><div class="card-body d-flex align-items-center gap-2"><i class="bi bi-check-circle ico"></i>Không có cảnh báo nào. Mọi thứ đang ổn.</div></div></div>';
      return;
    }
    box.innerHTML = list.map(function (a) {
      var more = a.items.length > 4 ? '<li class="text-muted">+ ' + (a.items.length - 4) + ' mục nữa</li>' : '';
      return '<div class="col-12 col-md-6 col-xl-4"><a class="card alert-card lv-' + a.level + ' h-100" href="#' + esc(a.link || 'dashboard') + '"><div class="card-body">' +
        '<div class="d-flex align-items-start gap-2"><i class="bi bi-' + esc(a.icon) + ' ico"></i><div class="flex-grow-1 min-w-0">' +
        '<div class="t">' + esc(a.title) + '<span class="cnt">' + a.items.length + '</span></div>' +
        '<ul>' + a.items.slice(0, 4).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + more + '</ul></div></div></div></a></div>';
    }).join('') + (loading ? '<div class="col-12 col-md-6 col-xl-4"><div class="skeleton"></div></div>' : '');
  }

  /** Cảnh báo tính ngay từ cấu hình đã tải (không gọi server). */
  function configAlerts() {
    var out = [];
    var push = function (level, icon, title, items, link) { if (items.length) out.push({ level: level, icon: icon, title: title, items: items, link: link }); };
    var blocks = blocksActive();
    var rooms = S.boot.rooms.filter(function (r) { return isOn(r.Active); });
    if (has('CONFIG_EDIT')) {
      push('warning', 'bank', 'Dãy chưa có tài khoản nhận tiền',
        blocks.filter(function (b) { return !b.BankBin || !b.BankAccountNo; }).map(function (b) { return b.BlockName + ': hoá đơn sẽ không có mã QR'; }), 'config/blocks');
      var feeItems = [];
      blocks.forEach(function (b) {
        var fs = blockFeeList(b.BlockID);
        if (!fs.length) return feeItems.push(b.BlockName + ': chưa có khoản phí nào');
        // giá 0đ là cố ý (vẫn in dòng 0đ trên hoá đơn) nên không cảnh báo
        var names = fs.map(function (f) { return f.CalcType; });
        if (names.indexOf('METER_ELEC') < 0) feeItems.push(b.BlockName + ': chưa có giá điện');
      });
      push('warning', 'tags', 'Bảng giá chưa đủ', feeItems, 'config/fees');
      if (!S.boot.settings.WATERMARK_PAID_ID) push('info', 'droplet-half', 'Chưa tạo watermark hoá đơn', ['Vào Cấu hình → Hệ thống → Tạo lại watermark'], 'config/system');
    }
    if (has('ROOM_EDIT')) {
      push('warning', 'cash', 'Phòng chưa có giá thuê', rooms.filter(function (r) { return !num(r.BaseRent); }).map(function (r) { return blockName(r.BlockID) + ' · P.' + r.RoomNo; }), 'rooms');
      push('info', 'camera', 'Phòng trống chưa có ảnh (chưa đăng tin được)', rooms.filter(function (r) { return r.Status === 'TRONG' && !r.CoverFileId; }).map(function (r) { return blockName(r.BlockID) + ' · P.' + r.RoomNo; }), 'rooms');
    }
    push('info', 'tools', 'Phòng đang bảo trì', rooms.filter(function (r) { return r.Status === 'BAO_TRI'; }).map(function (r) { return blockName(r.BlockID) + ' · P.' + r.RoomNo; }), 'rooms');
    return out;
  }

  /* ------------------------------------------------------------ Sơ đồ phòng */
  var roomFilter = { block: '', status: '', q: '' };
  VIEWS.rooms = function (el) {

    if (has('ROOM_EDIT') && blocksActive().length) {
      $('#topbar-actions').innerHTML = '<button class="btn btn-primary btn-sm" id="btn-add-room"><i class="bi bi-plus-lg"></i> Thêm phòng</button>';

    }
    var blocks = blocksActive();
    el.innerHTML =
      '<div class="d-flex flex-wrap gap-2 align-items-center mb-3">' +
      '<select class="form-select form-select-sm" style="max-width:200px" id="rf-block"><option value="">Tất cả dãy</option>' +
      blocks.map(function (b) { return '<option value="' + esc(b.BlockID) + '"' + (b.BlockID === roomFilter.block ? ' selected' : '') + '>' + esc(b.BlockName) + '</option>'; }).join('') + '</select>' +
      '<div class="filter-chips d-flex flex-wrap gap-1" id="rf-status">' +
      [{ v: '', l: 'Tất cả' }].concat(listOf('RoomStatus').map(function (s) { return { v: s.Value, l: s.Label }; })).map(function (s) {

      }).join('') + '</div>' +

      '</div><div id="room-list"></div>';

    $$('#rf-status button').forEach(function (b) { b.onclick = function () { roomFilter.status = b.getAttribute('data-v'); VIEWS.rooms(el); }; });
    $('#rf-q').oninput = function () { roomFilter.q = this.value.toLowerCase(); drawRooms(); };

  function drawRooms() {
    var list = $('#room-list'); if (!list) return;
    var q = roomFilter.q;
    var rooms = S.boot.rooms.filter(function (r) {
      return (!roomFilter.block || r.BlockID === roomFilter.block) && (!roomFilter.status || r.Status === roomFilter.status) &&
        (!q || (r.RoomNo + ' ' + r.RoomID + ' ' + (r.WifiSSID || '') + ' ' + (r.Amenities || '')).toLowerCase().indexOf(q) >= 0);
    });
    if (!rooms.length) { list.innerHTML = '<div class="card"><div class="empty"><i class="bi bi-search"></i>Không có phòng phù hợp.</div></div>'; return; }
    var byBlock = {};
    rooms.forEach(function (r) { (byBlock[r.BlockID] = byBlock[r.BlockID] || []).push(r); });
    list.innerHTML = Object.keys(byBlock).map(function (bid) {
      var floors = {};
      byBlock[bid].forEach(function (r) { (floors[r.Floor || '—'] = floors[r.Floor || '—'] || []).push(r); });
      return '<div class="mb-4"><div class="block-head"><h3>' + esc(blockName(bid)) + '</h3><span class="text-muted small">' + byBlock[bid].length + ' phòng</span></div>' +
        Object.keys(floors).sort().map(function (fl) {
          return '<div class="floor-label">Tầng ' + esc(fl) + '</div><div class="room-grid">' +
            floors[fl].sort(function (a, b) { return String(a.RoomNo).localeCompare(String(b.RoomNo), 'vi', { numeric: true }); }).map(roomCard).join('') + '</div>';
        }).join('') + '</div>';
    }).join('');
    $$('.room-card', list).forEach(function (c) { c.onclick = function () { roomDetail(c.getAttribute('data-id')); }; });
  }

  function roomCard(r) {
    return '<div class="room-card s-' + esc(r.Status) + (isOn(r.Active) ? '' : ' off') + '" data-id="' + esc(r.RoomID) + '">' +
      '<div class="d-flex justify-content-between align-items-start"><div class="no">' + esc(r.RoomNo) + '</div>' + statusPill(r.Status) + '</div>' +
      '<div class="meta">' + [r.AreaM2 ? esc(r.AreaM2) + ' m²' : '', r.MaxPeople ? 'tối đa ' + esc(r.MaxPeople) + ' người' : ''].filter(Boolean).join(' · ') + '&nbsp;</div>' +
      '<div class="price text-nowrap">' + vnd(r.BaseRent) + '<span class="text-muted fw-normal small">/th</span></div></div>';
  }

  function findRoom(id) { return S.boot.rooms.filter(function (r) { return r.RoomID === id; })[0]; }

  function roomDetail(id) {
    var r = findRoom(id);
    var b = blockOf(r.BlockID);
    var fees = roomFeeList(r);
    var row = function (k, v) { return '<tr><td class="text-muted" style="width:40%">' + k + '</td><td>' + v + '</td></tr>'; };
    var body =
      '<ul class="nav nav-tabs mb-3"><li class="nav-item"><a class="nav-link active" data-tab="info" href="javascript:void 0">Thông tin</a></li>' +
      '<li class="nav-item"><a class="nav-link" data-tab="photos" href="javascript:void 0">Ảnh phòng</a></li></ul>' +
      '<div data-pane="info"><table class="table table-sm">' +
      row('Dãy', esc(b.BlockName)) + row('Trạng thái', statusPill(r.Status)) + row('Tầng', esc(r.Floor)) +
      row('Diện tích', r.AreaM2 ? esc(r.AreaM2) + ' m²' : '') + row('Số người tối đa', esc(r.MaxPeople)) +
      row('Giá thuê', '<b>' + vnd(r.BaseRent) + '</b>') + row('Tiền cọc mặc định', vnd(r.DepositDefault)) +
      row('Kỳ thu tiền phòng', esc(payCycleText(r.PayCycle ? r : b))) +
      row('Wifi', esc(r.WifiSSID) + (r.WifiPassword ? ' / <code>' + esc(r.WifiPassword) + '</code>' : '')) +
      row('Tiện ích', esc(r.Amenities)) + row('Mô tả', esc(r.Description).replace(/\n/g, '<br>')) +
      '</table>' + (has('TENANT_VIEW') ? '<div id="rd-contract"></div>' : '') +
      '<div class="fw-semibold mb-1 mt-3">Bảng giá dịch vụ áp dụng</div>' +
      (fees.length ? '<table class="table table-sm">' + fees.map(function (f) {
        return '<tr><td>' + esc(f.FeeName) + (f._room ? ' <span class="badge text-bg-warning">riêng phòng</span>' : '') + '</td><td class="text-muted small">' +
          esc(labelOf('CalcType', f.CalcType)) + '</td><td class="text-end money">' + feePrice(f) + '</td></tr>';
      }).join('') + '</table>' : '<div class="text-muted small">Chưa cấu hình giá dịch vụ cho dãy này.</div>') +
      '</div><div data-pane="photos" class="d-none"><div id="room-photos"><div class="skeleton"></div></div></div>';
    var buttons = [];
    if (has('ROOM_EDIT')) buttons.push({ label: '<i class="bi bi-pencil"></i> Sửa', cls: 'btn-outline-primary', onClick: function () { setTimeout(function () { roomForm(r); }, 300); } });
    if (has('TENANT_EDIT') && r.Status === 'TRONG') buttons.push({ label: '<i class="bi bi-person-plus"></i> Cho thuê / nhận cọc', cls: 'btn-primary', onClick: function () { loadP2().then(function () { nextModal(function () { contractForm(r); }); }).catch(fail); } });
    buttons.push({ label: 'Đóng' });
    var root = openModal('Phòng ' + r.RoomNo + ' · ' + (b.BlockName || ''), body, buttons);
    $$('[data-tab]', root).forEach(function (t) {
      t.onclick = function () {
        $$('[data-tab]', root).forEach(function (x) { x.classList.toggle('active', x === t); });

      };
    });
    var cbox = $('#rd-contract', root);
    if (cbox) loadP2().then(function () {

      if (!c) return;
      var people = membersOf(c.ContractID).map(function (m) { return esc(tenantOf(m.TenantID).FullName); }).join(', ');
      cbox.innerHTML = '<div class="c-card s-' + esc(c.Status) + ' p-2 mt-2" id="rd-open-contract">' +
        '<div class="d-flex justify-content-between"><b>Hợp đồng ' + esc(c.ContractID) + '</b>' + cPill(c.Status) + '</div>' +
        '<div class="small text-muted">' + people + '</div>' +
        '<div class="small">Cọc ' + vnd(c.DepositAmount) + ' · ' + (c.Status === 'DA_COC' ? 'dự kiến vào ' + dmy(c.StartDate) : 'từ ' + dmy(c.StartDate) + (c.EndDate ? ' đến ' + dmy(c.EndDate) : '')) + '</div>' +
        '<div class="small text-primary mt-1">Xem hợp đồng <i class="bi bi-chevron-right"></i></div></div>';
      $('#rd-open-contract', root).onclick = function () { modal.hide(); nextModal(function () { contractDetail(c.ContractID); }); };

  function roomPhotos(r) {
    var box = $('#room-photos');
    var canEdit = has('ROOM_EDIT');
    call('files.list', { entityType: 'ROOM', entityId: r.RoomID }, { silent: true }).then(function (files) {
      files = files.filter(function (f) { return f.DocType === 'PHONG'; });
      return loadThumbs(files.map(function (f) { return f.DriveFileId; })).then(function () { return files; });
    }).then(function (files) {
      box.innerHTML =
        (canEdit ? '<label class="upload-drop d-block mb-3"><i class="bi bi-cloud-arrow-up fs-3 d-block"></i>Chọn hoặc chụp ảnh phòng (tự nén còn ~300KB/ảnh)' +
          '<input type="file" accept="image/*" multiple class="d-none" id="room-file"></label><div id="room-up"></div>' : '') +
        (files.length ? '<div class="photo-grid">' + files.map(function (f) {
          var cover = r.CoverFileId === f.DriveFileId;
          return '<div class="photo">' + (S.thumbs[f.DriveFileId] ? '<img loading="lazy" src="' + S.thumbs[f.DriveFileId] + '" alt="">' : '') +

            (canEdit ? '<div class="actions">' + (cover ? '' : '<button class="btn btn-light btn-sm" title="Đặt làm ảnh bìa" data-cover="' + esc(f.DriveFileId) + '"><i class="bi bi-star"></i></button>') +
              '<button class="btn btn-light btn-sm text-danger" title="Xoá" data-del="' + esc(f.FileID) + '"><i class="bi bi-trash"></i></button></div>' : '') + '</div>';
        }).join('') + '</div>' : '<div class="text-muted small">Chưa có ảnh.</div>');
      if (!canEdit) return;
      $('#room-file').onchange = function () {
        var files2 = Array.prototype.slice.call(this.files);
        if (!files2.length) return;
        var up = $('#room-up');
        up.innerHTML = files2.map(function (f, i) { return '<div class="upload-item" id="up-' + i + '">' + esc(f.name) + ': chờ…</div>'; }).join('');
        uploadFiles(files2, { entityType: 'ROOM', entityId: r.RoomID, docType: 'PHONG' }, function (i, st) {

      $$('[data-cover]', box).forEach(function (bt) {

        };
      });

  /** Vẽ watermark chéo (logo + chữ, không ghi trạng thái) trên nền trong suốt, khổ A4 150dpi. */
  function drawWatermark(text, logoImg) {
    var c = document.createElement('canvas');
    c.width = 1240; c.height = 1754;
    var g = c.getContext('2d');
    g.translate(c.width / 2, c.height / 2);
    g.rotate(-Math.PI / 6);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.globalAlpha = 0.07;
    if (logoImg) { var w = 520, h = w * logoImg.height / logoImg.width; g.drawImage(logoImg, -w / 2, -h / 2 - 300, w, h); }
    g.fillStyle = '#0f4c5c';
    g.font = 'bold 150px Arial, sans-serif';
    var size = 150; while (g.measureText(text).width > 1500 && size > 60) { size -= 10; g.font = 'bold ' + size + 'px Arial, sans-serif'; }
    g.fillText(text, 0, logoImg ? 40 : 0);
    return c;
  }
  /** 1 ảnh watermark dùng chung cho mọi hoá đơn (lưu vào cả 2 khoá cũ để server không phải đổi). */

    var text = (S.boot.settings.WATERMARK_TEXT || S.boot.settings.APP_NAME || '').toUpperCase();
    var loadLogo = new Promise(function (resolve) {
      if (!S.boot.logo) return resolve(null);
      var img = new Image(); img.onload = function () { resolve(img); }; img.onerror = function () { resolve(null); }; img.src = S.boot.logo;
    });
    return loadLogo.then(function (logo) {
      var canvas = drawWatermark(text, logo);
      var prev = $('#wm-preview'); if (prev) { prev.width = 248; prev.height = 351; prev.getContext('2d').drawImage(canvas, 0, 0, 248, 351); }
      busy(true);
      return call('files.upload', { entityType: 'SYSTEM', entityId: 'WATERMARK', docType: 'WATERMARK', base64: canvas.toDataURL('image/png'), mimeType: 'image/png', seq: 1 }, { silent: true })
        .then(function (res) { return call('settings.save', { WATERMARK_PAID_ID: res.driveFileId, WATERMARK_UNPAID_ID: res.driveFileId }, { silent: true }); })
        .then(function (st) { busy(false); S.boot.settings = st; toast('Đã tạo watermark.', 'ok'); }, function (e) { busy(false); throw e; });
    });
  }

  /** Đọc các dòng người ở; tạo/cập nhật khách, tải giấy tờ đã chọn, rồi trả về [{TenantID, Relation}]. */
  function resolvePeople(box) {
    var rows = $$('.person-row', box).map(function (row) {

      return { pick: g('pick'), FullName: g('FullName'), Phone: g('Phone'), Relation: g('Relation'), id: id, files: row._files || {} };
    });
    var bad = rows.filter(function (r) { return r.pick === 'NEW' && !r.FullName; });
    if (bad.length) return Promise.reject(new Error('Nhập họ tên cho khách mới (hoặc chọn khách có sẵn).'));
    var badId = rows.filter(function (r) { var n = String(r.id.IdNo || '').replace(/\D/g, ''); return n && !/^(\d{9}|\d{12})$/.test(n); });
    if (badId.length) return Promise.reject(new Error('Số CCCD phải có 12 chữ số (CMND cũ 9 số).'));
    var out = [], ups = [];
    return rows.reduce(function (p, r) {
      return p.then(function () {
        var save;
        if (r.pick === 'NEW') save = call('tenants.save', Object.assign({ FullName: r.FullName, Phone: r.Phone }, r.id));
        else {
          var t = tenantOf(r.pick);
          var changed = Object.keys(r.id).some(function (k) { return r.id[k] && r.id[k] !== String(t[k] || '').slice(0, k === 'IdNo' || k === 'Gender' || k === 'IdIssuePlace' || k === 'PermanentAddress' ? 999 : 10); });
          save = changed ? call('tenants.save', Object.assign({}, t, r.id, { TenantID: t.TenantID })) : Promise.resolve(null);

        var d = Object.assign(readForm(form), { ContractID: c.ContractID, OptionalFees: readOptFees(root) });
        return call('contracts.update', d).then(function (res) {
          setP2(res); toast('Đã lưu hợp đồng.', 'ok'); redrawView(); nextModal(function () { contractDetail(c.ContractID); });
        }).catch(fail);
      } }
    ]);
  }

  /* ---- Màn Tạm trú */
  var rs = { filter: 'TODO', q: '' };
  VIEWS.residence = function (el) {
    $('#topbar-actions').innerHTML = '<button class="btn btn-outline-primary btn-sm" id="btn-tamvang"><i class="bi bi-plus-lg"></i> Tạm vắng</button>';
    $('#btn-tamvang').onclick = function () { loadP2().then(function () { residenceForm(null); }).catch(fail); };
    if (!S.p2) el.innerHTML = '<div class="skeleton"></div>';
    loadP2().then(function () { if (S.view === 'residence') drawResidence(el); }).catch(p2Fail(el));
  };
  function contractOfRes(r) { return r.ContractID ? contractById(r.ContractID) : null; }
  function drawResidence(el) {
    var todo = S.p2.residence.filter(function (r) { return !toBool(r.Done); }).length;
    var chips = [['TODO', 'Cần xử lý (' + todo + ')'], ['ALL', 'Tất cả']].concat(listOf('ResidenceStatus').map(function (s) { return [s.Value, s.Label]; }));
    el.innerHTML = '<div class="d-flex flex-wrap gap-2 align-items-center mb-3"><div class="filter-chips d-flex flex-wrap gap-1">' + chips.map(function (c) {
        return '<button class="btn btn-sm ' + (rs.filter === c[0] ? 'btn-primary' : 'btn-outline-primary') + '" data-rf="' + c[0] + '">' + esc(c[1]) + '</button>';
      }).join('') + '</div><input class="form-control form-control-sm ms-lg-auto" style="max-width:220px" id="rs-q" placeholder="Tìm tên, phòng…" value="' + esc(rs.q) + '"></div><div id="rs-list"></div>';
    $$('[data-rf]', el).forEach(function (b) { b.onclick = function () { rs.filter = b.getAttribute('data-rf'); drawResidence(el); }; });
    $('#rs-q').oninput = function () { rs.q = this.value.toLowerCase(); drawRsList(); };
    drawRsList();
  }
  function drawRsList() {
    var box = $('#rs-list'); if (!box) return;
    var list = S.p2.residence.filter(function (r) {
      var ok = rs.filter === 'ALL' ? true : rs.filter === 'TODO' ? !toBool(r.Done) : r.Status === rs.filter;
      if (!ok) return false;
      var c = contractOfRes(r);
      return !rs.q || (tenantOf(r.TenantID).FullName + ' ' + (c ? roomLabel(c.RoomID) : '')).toLowerCase().indexOf(rs.q) >= 0;
    }).sort(function (a, b) {
      var da = daysTo(a.ExpiryDate), db = daysTo(b.ExpiryDate);
      return (da === null ? 9999 : da) - (db === null ? 9999 : db) || String(a.ResID).localeCompare(String(b.ResID));
    });
    if (!list.length) { box.innerHTML = '<div class="card"><div class="empty"><i class="bi bi-card-checklist"></i>' + (rs.filter === 'TODO' ? 'Không còn hồ sơ nào cần xử lý.' : 'Không có hồ sơ phù hợp.') + '</div></div>'; return; }
    box.innerHTML = '<div class="row g-2">' + list.map(function (r) {
      var t = tenantOf(r.TenantID), c = contractOfRes(r), n = daysTo(r.ExpiryDate), done = toBool(r.Done);
      return '<div class="col-12 col-md-6 col-xl-4"><div class="card c-card h-100' + (done ? ' opacity-75' : '') + '" data-r="' + esc(r.ResID) + '"><div class="card-body">' +
        '<div class="d-flex justify-content-between gap-2"><div><div class="fw-semibold">' + esc(t.FullName) + '</div><div class="small text-muted">' + (c ? esc(roomLabel(c.RoomID)) : '') + '</div></div>' +
        '<div class="text-end"><span class="badge ' + (r.Type === 'TAM_VANG' ? 'text-bg-secondary' : 'text-bg-light') + '">' + esc(labelOf('ResidenceType', r.Type)) + '</span><div class="mt-1">' + resPill(r.Status) + '</div></div></div>' +
        '<div class="small mt-2">' + [r.SubmitDate ? 'Nộp ' + dmy(r.SubmitDate) : '', r.ApproveDate ? 'Duyệt ' + dmy(r.ApproveDate) : '',
          r.ExpiryDate ? '<span class="' + (n !== null && n < 0 ? 'text-danger fw-semibold' : n !== null && n <= 15 ? 'text-warning fw-semibold' : '') + '">Hết hạn ' + dmy(r.ExpiryDate) + '</span>' : ''].filter(Boolean).join(' · ') + '</div>' +
        (r.MissingDocs ? '<div class="small text-danger mt-1"><i class="bi bi-exclamation-circle"></i> Thiếu: ' + esc(r.MissingDocs) + '</div>' : '') +
        (r.Note ? '<div class="small text-muted mt-1">' + esc(r.Note) + '</div>' : '') +
        '<div class="form-check form-switch mt-2" data-stop="1"><input class="form-check-input" type="checkbox" data-done="' + esc(r.ResID) + '"' + (done ? ' checked' : '') + '>' +
        '<label class="form-check-label small">Đã xử lý' + (done && r.DoneBy ? ' · ' + esc(r.DoneBy) + ' ' + dmy(r.DoneAt) : '') + '</label></div>' +
        '</div></div></div>';
    }).join('') + '</div>';
    $$('[data-r]', box).forEach(function (cd) { cd.onclick = function () { residenceForm(S.p2.residence.filter(function (r) { return r.ResID === cd.getAttribute('data-r'); })[0]); }; });
    $$('[data-done]', box).forEach(function (cb) {
      cb.onchange = function () {
        var r = S.p2.residence.filter(function (x) { return x.ResID === cb.getAttribute('data-done'); })[0];
        call('residence.save', Object.assign({}, r, { Done: cb.checked })).then(function (res) {
          setP2(res); toast(cb.checked ? 'Đã đánh dấu xử lý xong.' : 'Đã mở lại hồ sơ.', 'ok'); drawResidence($('#content'));
        }).catch(function (e) { cb.checked = !cb.checked; fail(e); });
      };
    });
  }
  function residenceForm(r) {
    var isNew = !r;
    var fields = [];
    if (isNew) {
      var opts = [];
      S.p2.contracts.filter(function (c) { return c.Status === 'DANG_THUE'; }).forEach(function (c) {
        membersOf(c.ContractID).forEach(function (m) { opts.push({ value: c.ContractID + '|' + m.TenantID, label: tenantOf(m.TenantID).FullName + ' · ' + roomLabel(c.RoomID) }); });
      });
      if (!opts.length) return toast('Chưa có ai đang thuê.', 'err');
      fields.push({ name: 'who', label: 'Người', type: 'select', col: 8, required: true, options: opts });
      fields.push({ name: 'Type', label: 'Loại', type: 'select', col: 4, options: listOf('ResidenceType').map(function (x) { return { value: x.Value, label: x.Label }; }) });
    }
    fields = fields.concat([
      { name: 'Status', label: 'Trạng thái', type: 'select', col: 6, options: listOf('ResidenceStatus').map(function (x) { return { value: x.Value, label: x.Label }; }) },
      { name: 'SubmitDate', label: 'Ngày nộp', type: 'date', col: 6 },
      { name: 'ApproveDate', label: 'Ngày duyệt', type: 'date', col: 6 },
      { name: 'ExpiryDate', label: isNew ? 'Đến ngày' : 'Ngày hết hạn', type: 'date', col: 6 },
      { name: 'MissingDocs', label: 'Giấy tờ còn thiếu', placeholder: 'Giấy kết hôn, xác nhận cư trú…' },
      { name: 'Note', label: 'Ghi chú', type: 'textarea', rows: 2 },
      { name: 'Done', label: 'Đã xử lý xong', type: 'check', def: false }
    ]);
    var t = r ? tenantOf(r.TenantID) : null, c = r ? contractOfRes(r) : null;
    var body = (r ? '<div class="mb-3"><div class="fw-semibold">' + esc(t.FullName) + ' ' + tel(t.Phone) + '</div><div class="small text-muted">' +
        esc(labelOf('ResidenceType', r.Type)) + (c ? ' · ' + esc(roomLabel(c.RoomID)) : '') + '</div></div>' : '') +
      '<form id="rs-form">' + formHtml(fields, r || { Type: 'TAM_VANG', Status: 'CHUA_NOP', Done: false }) + '</form>' +
      (c ? '<div class="fw-semibold mt-4 mb-2">Hồ sơ tạm trú đã nộp</div><div id="rs-files"></div>' : '');
    var root = openModal(isNew ? 'Thêm tạm vắng / tạm trú' : 'Hồ sơ ' + labelOf('ResidenceType', r.Type).toLowerCase(), body, [
      { label: 'Huỷ' },
      { label: 'Lưu', cls: 'btn-primary', onClick: function () {
        var form = $('#rs-form', root); if (!validForm(form)) return false;
        var d = readForm(form);
        if (isNew) { var w = d.who.split('|'); d.ContractID = w[0]; d.TenantID = w[1]; delete d.who; } else d.ResID = r.ResID;
        return call('residence.save', d).then(function (res) { setP2(res); toast('Đã lưu hồ sơ.', 'ok'); redrawView(); }).catch(fail);
      } }
    ]);
    if (c) filesBox($('#rs-files', root), 'CONTRACT', c.ContractID, ['TAMTRU'], true);
  }

  /* ------------------------------------------------------------ Tài khoản */
  VIEWS.account = function (el) {
    var u = S.boot.user;
    el.innerHTML = '<div class="row g-3"><div class="col-12 col-lg-5"><div class="card"><div class="card-header">Thông tin</div><div class="card-body">' +
      '<div class="fw-semibold fs-5">' + esc(u.fullName) + '</div><div class="text-muted">' + esc(u.username) + ' · ' + esc(ROLE_LABEL[u.role] || u.role) + '</div>' +
      '<div class="small mt-2">Dãy được giao: ' + esc(u.scope === '*' ? 'Tất cả' : u.scope) + '</div>' +
      '<button class="btn btn-outline-danger btn-sm mt-3" data-act="logout"><i class="bi bi-box-arrow-right"></i> Đăng xuất</button></div></div></div>' +
      '<div class="col-12 col-lg-7"><div class="card"><div class="card-header">Đổi mật khẩu</div><div class="card-body"><form id="pw-form">' + formHtml([
        { name: 'oldPassword', label: 'Mật khẩu hiện tại', type: 'password', required: true, attrs: 'autocomplete="current-password"' },
        { name: 'newPassword', label: 'Mật khẩu mới (tối thiểu 8 ký tự)', type: 'password', col: 6, required: true, attrs: 'autocomplete="new-password"' },
        { name: 'confirm', label: 'Nhập lại mật khẩu mới', type: 'password', col: 6, required: true, attrs: 'autocomplete="new-password"' }
      ]) + '</form></div><div class="card-footer bg-white text-end"><button class="btn btn-primary" id="pw-save">Đổi mật khẩu</button></div></div></div></div>';
    $('#pw-save').onclick = function () {
      var form = $('#pw-form'); if (!validForm(form)) return;
      var d = readForm(form);
      if (d.newPassword !== d.confirm) return toast('Mật khẩu nhập lại không khớp.', 'err');
      call('auth.changePassword', d).then(function () { form.reset(); toast('Đã đổi mật khẩu.', 'ok'); }).catch(fail);
    };
  };

  /* ------------------------------------------------------------ Khởi động */
  if (S.token) start(); else showLogin();
})();
</script>

</body>
</html>
